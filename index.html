<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길지 Gilji · 클로즈드 베타</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  color-scheme: light;
  --paper: #f5f6f8;          /* app background: soft gray, like Naver / Toss */
  --card: #ffffff;
  --ink: #191f28;
  --ink-2: #4e5968;
  --ink-3: #8b95a1;
  --line: #e9ecef;
  --accent: #f0675c;         /* warm coral */
  --accent-soft: #fff0ee;
  --sage: #20a97a;           /* jade */
  --sage-soft: #e9f8f1;
  --wood: #20a97a;
  --fire: #f0675c;
  --earth: #e8a93b;
  --metal: #a3a9b3;
  --water: #4c7bd9;
  --shadow: 0 2px 14px rgba(25,31,40,.05);
  --display: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.65 var(--display); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: var(--display); }
.wrap { max-width: 460px; margin: 0 auto; padding: 0 16px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin: 0 -16px; position: sticky; top: 0; z-index: 5; background: rgba(245,246,248,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.mark { width: 34px; height: 34px; flex: none; }
.brand b { font: 800 20px var(--display); letter-spacing: -.5px; }
.demo-tag { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600; white-space: nowrap; }
.bar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand .en { font: 600 13px var(--display); color: var(--ink-3); margin-left: -4px; }
/* 한국어 / ENG toggle */
.lang { display: inline-flex; flex: none; background: var(--card); border-radius: 99px; padding: 2px; box-shadow: var(--shadow); }
.lang button { border: 0; background: none; min-height: 36px; padding: 0 11px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
@media (max-width: 360px) { .demo-tag { display: none; } }

/* home */
.hero { padding: 28px 18px 24px; text-align: center; margin-top: 4px; border-radius: 26px; background: linear-gradient(160deg, #fff4ee 0%, #fdeef3 45%, #eef6ff 100%); }
.hero h1 { font: 800 26px/1.38 var(--display); margin: 0 0 10px; letter-spacing: -.6px; }
.hero p { color: var(--ink-2); margin: 0; font-size: 15px; }
.search { display: flex; gap: 8px; margin-top: 24px; }
.search input {
  flex: 1; min-width: 0; padding: 15px 16px; border-radius: 14px; border: 1.5px solid var(--line); font-size: 16px;
  background: var(--card); color: var(--ink); font: inherit;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn {
  border: 0; border-radius: 14px; padding: 14px 18px; background: var(--accent); color: #fff;
  font-weight: 700; white-space: nowrap;
}
.btn.accent { background: var(--accent); color: #fff; }
.btn.ghost { background: #f2f4f6; color: var(--ink-2); border: 0; }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 99px; }
.btn.block { width: 100%; }
.hint { font-size: 13px; color: var(--ink-3); margin: 10px 4px 0; min-height: 20px; }
.hint.err { color: var(--accent); }
.section-label { font-size: 17px; font-weight: 700; color: var(--ink); margin: 30px 4px 12px; }
.sample { display: grid; gap: 8px; }
.sample button {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  background: var(--card); border: 0; border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow);
}
.sample small { display: block; color: var(--ink-3); font-size: 12px; }
.sample .arrow { color: var(--ink-3); }
.ladder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ladder div { background: var(--card); border: 0; box-shadow: var(--shadow); border-radius: 16px; padding: 12px 8px; text-align: center; }
.ladder b { display: block; font: 700 15px var(--display); }
.ladder span { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.ladder em { display: block; font-style: normal; font-size: 12px; color: var(--accent); margin-top: 4px; font-weight: 700; }

/* reading */
.reading { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 18px; }
.bob { animation: bob 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bob { 50% { transform: translateY(-6px) scaleY(1.03); } }
.flap { animation: flap 1.6s ease-in-out infinite; }
@keyframes flap { 50% { transform: translateY(-4px) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { .bob, .flap { animation: none; } }
.duo { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin-bottom: 12px; }
.duo .flap { margin-bottom: 60px; }
.says { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: end; margin-top: 16px; }
.bubble { position: relative; background: #f2f4f6; border-radius: 16px 16px 16px 4px; padding: 12px 14px; font: 700 16px/1.55 var(--display); }
.tip .when { align-items: center; }
.tip .who { display: flex; align-items: center; gap: 6px; }
.tip .who svg { background: #fbf3e4; border-radius: 12px; padding: 3px 4px; flex: none; }
.reading ol { list-style: none; padding: 0; margin: 0; color: var(--ink-3); font-size: 14px; }
.reading li { transition: color .3s; }
.reading li.on { color: var(--ink); }
.reading li.done { color: var(--sage); }

/* cards */
.card { background: var(--card); border: 0; border-radius: 22px; padding: 22px 20px; margin-top: 14px; box-shadow: var(--shadow); }
.card h2 { font: 700 18px var(--display); margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card h2 small { font: 400 12px var(--display); color: var(--ink-3); }
.addr { font-size: 13px; color: var(--ink-2); }
.top { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: center; margin-top: 10px; }
.dial { position: relative; width: 124px; height: 124px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .num b { font: 700 38px/1 var(--display); }
.dial .num span { font-size: 12px; color: var(--ink-3); }
.dial .num span.stars { font-size: 12px; letter-spacing: 1px; margin-top: 4px; color: var(--accent); }
.facts b small { font-size: .6em; color: var(--ink-3); font-weight: 600; }
.level-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.level-chips .chip { background: var(--paper); color: var(--ink-2); font-size: 12px; }
.level-chips .chip.warn { color: var(--accent); }
.grade { display: inline-block; font: 700 15px var(--display); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 14px; }
.headline { font: 700 17px/1.55 var(--display); margin: 10px 0 0; }
.meta { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* today's tip */
.tip { background: var(--sage-soft); border-color: transparent; }
.tip .when { font-size: 12px; color: var(--sage); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.tip h3 { font: 700 19px/1.45 var(--display); margin: 8px 0 6px; }
.tip p { margin: 0; font-size: 14px; color: var(--ink-2); }
/* "US living" card: a different look from the 풍수 cards, so it never reads as part of the score */
.usl { border: 1px dashed var(--line); background: transparent; }
.chat .msgs { display: grid; gap: 8px; }
.chat .q { justify-self: end; max-width: 85%; background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.6; }
.chat .a { max-width: 92%; background: #f2f4f6; padding: 10px 13px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 1.75; }
.chat .a.wait { color: var(--ink-3); }
.chat .a.err { color: var(--accent); }
.chat .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chat .facts span { font-size: 12px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.chat .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chat .sugg .btn { text-align: left; }
.chat .chat-note { font-size: 12px; color: var(--ink-3); margin: 8px 2px 0; }
.usl .usl-note { font-size: 13px; color: var(--ink-3); margin: -4px 0 12px; }
.usl .it { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.usl .k { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; margin-top: 3px; }
.usl .k.good { background: var(--card); color: var(--sage); }
.usl .k.mixed { background: var(--card); color: var(--ink-2); }
.usl .k.know { background: var(--card); color: var(--accent); }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--card); color: var(--sage); }
.tip .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.tip .btn.ghost { background: var(--card); border-color: transparent; }

/* map */
.map .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: 0; }
.leaf { height: 380px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); z-index: 0; }
.leaf .sect-label span { display: inline-block; transform: translate(-50%, -50%); background: rgba(255,255,255,.94); color: #191f28; border: 1.5px solid; border-radius: 10px; padding: 2px 8px; font: 12px/1.35 var(--display); text-align: center; white-space: nowrap; }
.leaf .sect-label em { font-style: normal; font-size: 11px; color: #6b625a; }
.leaf .peak { white-space: nowrap; }
.leaf .peak i { display: block; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid; transform: translate(-50%, -100%); filter: drop-shadow(0 0 1px #fff); }
.leaf .peak span { display: block; transform: translate(-50%, -6px); font: 700 11px var(--display); color: #2e2925; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.leaf .face-arrow span { display: block; color: #b8684e; font-size: 16px; line-height: 18px; text-align: center; }
.leaf .home-pin img { filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
.leaf .sal-mark { background: #c0392b; color: #fff; border-radius: 50%; font: 700 13px/20px sans-serif; text-align: center; box-shadow: 0 0 0 2px #fff; }
.watch-note { color: #c0392b; }
.sasinsa .side { font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 4px; }
.water-note { font-size: 13px; color: var(--ink-2); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.sasinsa { display: grid; gap: 6px; margin-top: 12px; font-size: 14px; }
.sasinsa div { display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.sasinsa b { font-family: var(--display); }

/* detail components (folded) */
details.card > summary { list-style: none; cursor: pointer; font: 700 16px var(--display); display: flex; justify-content: space-between; align-items: center; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary span { font: 400 12px var(--display); color: var(--ink-3); }
details.card[open] > summary { margin-bottom: 14px; }
.comp { display: grid; gap: 12px; }
.comp .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.comp .name b { font-family: var(--display); }
.comp .name span { color: var(--ink-3); font-size: 12px; margin-left: 4px; }
.comp .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.comp .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.comp .fill { height: 100%; background: var(--sage); border-radius: 3px; transition: width .8s ease; }
.comp .fill.low { background: var(--accent); }
.comp .fact { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }

/* paywall */
.locked { position: relative; max-height: 440px; overflow: hidden; border-radius: 20px; }
.locked .blur { filter: blur(6px); pointer-events: none; user-select: none; opacity: .7; }
.pay {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 20px;
  background: linear-gradient(180deg, transparent 10%, var(--paper) 60%);
}
.pay h3 { font: 700 19px var(--display); margin: 0; }
.pay p { margin: 0; font-size: 13px; color: var(--ink-2); }
.pay .price { font: 700 26px var(--display); color: var(--accent); }

.summary p { margin: 0 0 8px; font-family: var(--display); font-size: 16px; line-height: 1.85; }
.tips { display: grid; gap: 10px; }
.tips .t { border-radius: 14px; background: var(--paper); padding: 12px 14px; }
.tips .t h4 { margin: 0 0 4px; font: 700 15px var(--display); display: flex; gap: 8px; align-items: center; }
.tips .t p { margin: 0; font-size: 13px; color: var(--ink-2); }
.watch { display: grid; gap: 10px; margin-bottom: 14px; }
.watch .w { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.watch .w h4 { margin: 0 0 4px; font: 700 15px var(--display); display: flex; justify-content: space-between; align-items: baseline; }
.watch .w h4 small { font: 400 12px var(--display); color: var(--ink-3); }
.watch .w p { margin: 0; font-size: 13px; color: var(--ink-2); }
.watch .w .fix { margin-top: 8px; font-size: 13px; background: var(--sage-soft); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.watch .w .fix b { color: var(--sage); }
.giun { display: grid; gap: 12px; }
.giun .g { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.giun .g b { font-family: var(--display); }
.stars { color: var(--accent); letter-spacing: 2px; font-size: 14px; }
.stars i { color: var(--line); font-style: normal; }
.giun .g p { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink-2); }
.oh { display: grid; gap: 7px; }
.oh .r { display: grid; grid-template-columns: 54px 1fr 38px; gap: 8px; align-items: center; font-size: 13px; }
.oh .t { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.oh .t div { height: 100%; border-radius: 5px; }
.oh .pct { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.oh-note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.none { font-size: 14px; color: var(--ink-2); margin: 0; }
.photo-up { display: flex; gap: 12px; align-items: center; }
.photo-up .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; background: var(--paper); display: grid; place-items: center; color: var(--ink-2); }
.photo-up p { margin: 0; font-size: 13px; color: var(--ink-2); }
.disclaimer { font-size: 12px; color: var(--ink-3); text-align: center; margin: 22px 8px 0; line-height: 1.6; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

/* compare */
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.pick button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.pick button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.cmp table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; margin-top: 12px; }
.cmp th, .cmp td { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
.cmp th:first-child, .cmp td:first-child { text-align: left; color: var(--ink-3); width: 72px; font-weight: 400; }
.cmp thead th { font: 700 13px/1.35 var(--display); }
.cmp .big { font: 700 22px var(--display); }
.cmp .best { color: var(--accent); }
.cmp .tag { font-size: 11px; color: var(--accent); display: block; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(30,26,22,.45); display: grid; place-items: end center; padding: 16px; z-index: 10; }
.sheet { width: 100%; max-width: 440px; background: var(--card); border-radius: 22px; padding: 22px 20px; max-height: 85vh; overflow: auto; }
.sheet h3 { font: 700 19px var(--display); margin: 0 0 8px; }
.sheet p { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
.sheet .count { font-size: 12px; color: var(--ink-3); }
.about { font-size: 14px; color: var(--ink-2); }
.about h3 { font-size: 16px; color: var(--ink); margin: 16px 0 4px; }
.about p { margin: 0 0 6px; }

/* sample cards with a picture */
.sample { gap: 14px; }
.sample .pcard { display: block; padding: 0; overflow: hidden; }
.pc-img { display: block; position: relative; aspect-ratio: 16 / 9; background: #e9ecef; overflow: hidden; }
.pc-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.pcard:hover .pc-img img, .pcard:active .pc-img img { transform: scale(1.04); }
.pc-img em { position: absolute; left: 10px; bottom: 6px; font-style: normal; font-size: 9.5px; color: rgba(255,255,255,.88); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.pc-score { position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,.94); color: var(--accent); font-weight: 800; font-size: 15px; border-radius: 99px; padding: 3px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.pc-body { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 16px; text-align: left; }
.pc-body small { display: block; color: var(--ink-3); font-size: 12px; }

/* motion: gentle, never in the way (all off with reduced motion) */
.char { display: block; user-select: none; -webkit-user-drag: none; }
.think { animation: think 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes think { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } }
.pop { animation: pop .7s cubic-bezier(.34,1.56,.64,1) both .35s; transform-origin: 50% 100%; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.btn, .sample button, .pick button { transition: transform .12s ease, box-shadow .2s ease; }
.btn:active, .sample button:active, .pick button:active { transform: scale(.97); }
.hero .duo .char:first-child { animation: bob 2.2s ease-in-out infinite; }
.flap { animation: glide 3.2s ease-in-out infinite; }
@keyframes glide { 0%,100% { transform: translate(0,0) rotate(-4deg); } 50% { transform: translate(-6px,-10px) rotate(3deg); } }
.tip .who .char { animation: glide 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .think, .pop, .rise, .flap, .hero .duo .char:first-child, .tip .who .char { animation: none !important; } .pc-img img { transition: none; } }

/* Zillow lessons (Nov 16): media first, big key facts, save/share, jump tabs, a thumb-reach action dock */
.hero-media { position: relative; margin: 4px 0 0; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 10; background: #e9ecef; box-shadow: var(--shadow); }
.hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kenburns 14s ease-out both; }
@keyframes kenburns { from { transform: scale(1.08); } to { transform: scale(1); } }
.hero-media em { position: absolute; left: 12px; bottom: 8px; font-style: normal; font-size: 10px; color: rgba(255,255,255,.9); text-shadow: 0 1px 2px rgba(0,0,0,.55); }
.sum-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sum-actions { display: flex; gap: 8px; flex: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #f2f4f6; color: var(--ink-2); display: grid; place-items: center; }
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }
.icon-btn.beat { animation: beat .45s ease; }
@keyframes beat { 30% { transform: scale(1.25); } 60% { transform: scale(.92); } }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); margin: 14px 0 4px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts div { text-align: center; }
.facts div + div { border-left: 1px solid var(--line); }
.facts b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.5px; line-height: 1.3; }
.facts span { font-size: 11.5px; color: var(--ink-3); }

function countUp(el) {      // the score climbs with the ring
  const end = parseInt(el.textContent, 10);
  if (!(end > 0) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 1000;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  el.textContent = "0"; requestAnimationFrame(step);
}
function dial(n) {      // one rating for every home: n of 5 stars (rules v0.8)
  const r = 52, c = 2 * Math.PI * r, off = c * (1 - n / 5);
  return `<div class="dial" role="img" aria-label="${T({ ko: `별 5개 중 ${n}개`, en: `${n} of 5 stars` })}"><svg viewBox="0 0 124 124" aria-hidden="true">
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}" style="transition:stroke-dashoffset 1s ease"/>
  </svg><div class="num" aria-hidden="true"><b>${n}</b><span>/ 5</span><span class="stars">${stars(n)}</span></div></div>`;
}

function starsRange(r) {   // the stars hang on the exact spot (stability ring, live readings only)

  if (!st || st[0] === st[1]) return "";
  return `<div class="meta" style="margin-top:6px">${T({ ko: `집의 정확한 위치에 따라 별 ${st[0]}개에서 ${st[1]}개 사이로 달라질 수 있어요.`,
    en: `Depending on exactly where the house sits, this could be ${st[0]} to ${st[1]} stars.` })}</div>`;
}
function levelLine(r) {
  const n = r.sal.length, water = r.score.components.deuksu.facts.distance_m != null;
  if (isEn()) {   // same words as api/card.py's English level card
    const thing = n === 1 ? "one thing" : `${n} things`;
    const second = water && n ? `The water nearby and ${thing} to watch are what set this home apart.`
      : water ? "The water nearby is what sets this home apart."
      : n ? `${thing[0].toUpperCase() + thing.slice(1)} to watch ${n === 1 ? "is" : "are"} what sets this home apart.` : "Nothing nearby to watch.";
    return `The land is level here, so this rating rests on water, roads and the things to watch. ${second}`;
  }
  const second = water && n ? `가까운 물과 살펴볼 점 ${n}가지가 이 집을 다르게 해요.`
    : water ? "가까운 물이 이 집을 다르게 해요."
    : n ? `살펴볼 점 ${n}가지가 이 집을 다르게 해요.` : "가까이 살펴볼 점은 없어요.";
  return `땅이 평평한 집이라 물과 길, 살펴볼 점으로 읽었어요. ${second}`;
}
function levelChips(r) {
  const chips = r.sal.map((x) => `<span class="chip warn">${salName(x)}</span>`).slice(0, 3);
  const d = r.score.components.deuksu.facts;
  if (d.distance_m == null) chips.push(`<span class="chip">${T({ ko: "가까운 물이 없어요", en: "No water close by" })}</span>`);
  else if (d.bend !== "bangung") chips.push(`<span class="chip">${d.bend === "hwanpo" ? T({ ko: "물이 감싸 흘러요", en: "Water curves around" })
    : d.bend === "straight" ? T({ ko: "물이 곧게 지나요", en: "Water runs straight past" }) : T({ ko: "가까이 물이 있어요", en: "Water close by" })}</span>`);
  chips.push(`<span class="chip">${T({ ko: "평평한 땅", en: "Level ground" })}</span>`);
  if (!r.sal.length) chips.push(`<span class="chip">${T({ ko: "살펴볼 점 없음", en: "Nothing to watch" })}</span>`);
  return `<div class="level-chips">${chips.slice(0, 4).join("")}</div>`;
}

function factLine(key, f) {
  const en = isEn();
  switch (key) {
    case "hyeonmu": return en ? `Rises ${f.rise_m} m behind · blocks ${f.back_horizon_deg}° of the sky behind`
      : `뒤로 ${f.rise_m}m 솟음 · 뒤 하늘 ${f.back_horizon_deg}° 가림`;
    case "jujak": return en
      ? (f.ansan ? `Low hill in front: ${place(f.ansan_name) || ""}` : "No low hill in front") + ` · blocks ${f.front_horizon_deg}° of the sky in front` + (f.front_overbearing ? " · the hill in front is taller than the back" : "")
      : (f.ansan ? `앞의 낮은 산 ${f.ansan_name || ""}` : "앞의 낮은 산 없음") + ` · 앞 하늘 ${f.front_horizon_deg}° 가림` + (f.front_overbearing ? " · 앞산이 뒷산보다 높음" : "");
    case "enclosure": return en
      ? `Left ${f.cheongryong_deg}° · right ${f.baekho_deg}°` + (f.weak_side ? ` · ${T(SIDE[f.weak_side]).toLowerCase()} side weak` : " · both sides open")
      : `왼쪽 ${f.cheongryong_deg}° · 오른쪽 ${f.baekho_deg}°` + (f.weak_side ? ` · ${T(SIDE[f.weak_side])} 약함` : " · 양쪽 모두 트임");
    case "jangpung": {  // rules v0.2: the cold wind is regional (Korea: 북서풍)
      const IX = { N: 0, NE: 1, E: 2, SE: 3, S: 4, SW: 5, W: 6, NW: 7 };
      const w = DIR8[en ? "en" : "ko"][IX[f.wind_from] != null ? IX[f.wind_from] : 7];
      return en ? `Cold-wind side (${w}) ${f.wind_open ? "open" : "sheltered"} · ${f.mean_deg}° on average all around`
        : `찬바람(${w}) 쪽이 ${f.wind_open ? "열림" : "막힘"} · 사방 평균 ${f.mean_deg}°`;
    }
    case "deuksu": return `${riverName(f)} ${bend(f.bend)}` + (f.water_name && f.water_name !== f.bend_river
      ? (en ? ` · nearest water ${place(f.water_name)} ${f.distance_m} m` : ` · 가장 가까운 물 ${f.water_name} ${f.distance_m}m`)
      : f.bend_river ? (en ? ` · ${f.distance_m} m` : ` · ${f.distance_m}m`) : "");
    case "jwahyang":  // rules v0.2: winter sun, not the door bearing
      return en
        ? (f.sun_lost_h >= 0.5 ? `Hills block the winter-solstice sun for ${f.sun_lost_h} h` : "Hills barely block the winter-solstice sun")
          + (f.faces_sun ? " · faces south" : "") + (f.off_south_deg >= 22.5 ? ` · the door is ${f.off_south_deg}° off due south` : "")
        : (f.sun_lost_h >= 0.5 ? `동짓날 해를 ${f.sun_lost_h}시간 가림` : "동짓날 해를 거의 안 가림")
          + (f.faces_sun ? " · 남쪽을 바라봄" : "") + (f.off_south_deg >= 22.5 ? ` · 현관은 정남에서 ${f.off_south_deg}° 비낌` : "");
    case "stability": return en ? `Ground slope ${f.slope_deg}°` : `대지 경사 ${f.slope_deg}°`;
  }
  return "";
}

function verdict(r, k) {
  const c = r.score.components;
  if (k === "hyeonmu") return c.hyeonmu.score >= 80 ? T({ ko: "든든해요", en: "Strong" })
    : c.hyeonmu.score >= 55 ? T({ ko: "보통이에요", en: "Average" }) : T({ ko: "약해요", en: "Weak" });
  if (k === "jujak") {
    const f = c.jujak.facts;
    return f.front_overbearing ? T({ ko: "앞산이 뒤보다 높아요", en: "Taller than the back" })
      : f.ansan ? T({ ko: "낮은 산이 마주 봐요", en: "A low hill faces it" }) : T({ ko: "트였어요", en: "Open" });
  }
  const deg = c.enclosure.facts[k === "cheongryong" ? "cheongryong_deg" : "baekho_deg"];
  return deg >= 3 ? T({ ko: "감싸요", en: "Wraps around" }) : deg >= 1.5 ? T({ ko: "낮아요", en: "Low" }) : T({ ko: "트였어요", en: "Open" });
}

// point at a bearing (deg, clockwise from north) and distance (m) from lat/lng
function dest(lat, lng, b, d) {
  const rad = (b * Math.PI) / 180;
  return [lat + (d * Math.cos(rad)) / 111320, lng + (d * Math.sin(rad)) / (111320 * Math.cos((lat * Math.PI) / 180))];
}

let leafMap = null;
function drawMap(id) {
  const el = $("sasinsa-map");
  if (!el || !window.L) return;
  if (leafMap) { leafMap.remove(); leafMap = null; }
  const r = R[id], lat = r.site.lat, lng = r.site.lng, facing = r.site.facing_deg;
  const m = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  m.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  leafMap = m;
  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom: 17,
    attribution: `© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM · ${T({ ko: "지도 스타일", en: "map style" })} © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)`,
  }).addTo(m);

  // four wedges, turned with the house: 현무 behind, 주작 in front, 청룡 on the left looking out
  const center = { hyeonmu: facing + 180, jujak: facing, cheongryong: facing - 90, baekho: facing + 90 };
  const RAD = 3300;
  Object.entries(center).forEach(([k, c]) => {
    const pts = [[lat, lng]];
    for (let a = c - 45; a <= c + 45; a += 5) pts.push(dest(lat, lng, a, RAD));

        const v = comps[k].score;
        return `<div class="row"><span class="name"><b>${T(COMP[k][1])}</b><span>${T(COMP[k][0])}</span></span><span class="val">${v}</span>
          <div class="track"><div class="fill${v < 50 ? " low" : ""}" style="width:0" data-w="${v}%"></div></div>
          <div class="fact">${factLine(k, comps[k].facts)}</div></div>`;
      }).join("")}</div>
    </details>

    <div class="card photo-up"><div class="ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></div>
      <p>${T({ ko: "<b>현장 사진 다섯 장</b>을 더하면 현관 방향과 길·고가 같은 살펴볼 점을 직접 확인해 더 정확하게 읽어 드려요. (다음 단계)",
        en: "Add <b>five photos from the site</b>, and we can check the door's direction and things to watch, like roads and overpasses, for a more accurate reading. (Coming next)" })}</p></div>

    <div class="actions">
      <button class="btn ghost" id="to-compare">${T({ ko: "다른 집과 비교", en: "Compare homes" })}</button>
      <button class="btn ghost" id="to-home">${T({ ko: "다른 집 보기", en: "See another home" })}</button>
    </div>
    <p class="disclaimer">${T(DISCLAIMER)}<br>${T({ ko: "데이터", en: "Data" })}: Copernicus GLO-30, © OpenStreetMap contributors</p>
    ${paid || BETA_FREE ? "" : `<div class="dock"><button class="btn accent" id="dock-buy">${T({ ko: "이 집 전체 해설 열기", en: "Open the full reading" })}<small>${T({ ko: "$1 · 베타 동안 무료", en: "$1 · free during the beta" })}</small></button></div>`}`;
  $("report").classList.toggle("has-dock", !paid && !BETA_FREE);

  // timers, not requestAnimationFrame: rAF stalls in background tabs and the bars would stay empty
  setTimeout(() => {
    document.querySelectorAll("#report .dial circle[data-off]").forEach((c) => (c.style.strokeDashoffset = c.dataset.off));
    document.querySelectorAll("#report .dial .num b").forEach(countUp);
  }, 60);
  $("report").querySelectorAll("details").forEach((d) => d.addEventListener("toggle", (e) => {
    if (e.target.open) setTimeout(() => e.target.querySelectorAll(".fill").forEach((f) => (f.style.width = f.dataset.w)), 30);
  }));
  if ($("buy")) $("buy").addEventListener("click", () => fakeDoor(id));
  if ($("dock-buy")) $("dock-buy").addEventListener("click", () => fakeDoor(id));
  const openChat = () => {
    const sh = $("chat-sheet"); if (!sh) return;
    sh.classList.add("open"); sh.setAttribute("aria-hidden", "false"); document.body.classList.add("noscroll");
    setTimeout(() => { const i = $("chat-q"); if (i && !matchMedia("(pointer: coarse)").matches) i.focus(); }, 350);
  };
  const closeChat = () => { const sh = $("chat-sheet"); if (!sh) return; sh.classList.remove("open"); sh.setAttribute("aria-hidden", "true"); document.body.classList.remove("noscroll"); };
  ["fab", "ask-open"].forEach((k) => { if ($(k)) $(k).addEventListener("click", openChat); });
  if ($("chat-sheet")) $("chat-sheet").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeChat(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeChat(); }, { once: true });
  $("report").querySelectorAll(".pc-tabs button").forEach((b) => b.addEventListener("click", () => {
    $("report").querySelectorAll(".pc-tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
    $("report").querySelectorAll(".pc-list").forEach((l) => l.classList.toggle("hidden", l.dataset.t !== b.dataset.t));
  }));
  $("report").querySelectorAll(".jump a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    if (a.getAttribute("href") === "#sec-ask") { openChat(); return; }
    const t = $(a.getAttribute("href").slice(1)); if (t) t.scrollIntoView({ behavior: "smooth" });
  }));
  $("heart").addEventListener("click", () => {
    const on = store.get("saved") !== id; store.set("saved", on ? id : null);
    const b = $("heart"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    b.querySelector("path").parentNode.setAttribute("fill", on ? "currentColor" : "none");
    b.classList.remove("beat"); void b.offsetWidth; b.classList.add("beat");
    rerenderTip(id);
    toast(on ? T({ ko: "내 집으로 저장했어요. 매일 박씨를 받아요.", en: "Saved as your home. You'll get a daily tip." }) : T({ ko: "저장을 취소했어요.", en: "Removed." }));
  });
  $("share").addEventListener("click", async () => {
    const url = location.origin + location.pathname + (ORDER.includes(id) ? "#p=" + id : "");
    const data = { title: T({ ko: "길지 · 우리 집의 기운", en: "Gilji · the energy of a home" }), text: `${shortName(id)} — ★ ${s.stars}/5 · ${gradeName(s.grade)}`, url };
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(url); toast(T({ ko: "링크를 복사했어요.", en: "Link copied." })); } catch (e) { toast(url); }
  });
  if (window.GILJI) GILJI.bindChat(id);
  bindTip(id);
  setTimeout(() => drawMap(id), 0);   // after show("report") makes the container visible
  $("to-compare").addEventListener("click", () => openCompare(id));
  $("to-home").addEventListener("click", () => show("home"));
}

function bindTip(id) {
  const save = $("save-home");
  if (save) save.addEventListener("click", () => { store.set("saved", id); rerenderTip(id); });
  const next = $("tip-next");
  if (next) next.addEventListener("click", () => { dayOffset++; rerenderTip(id); });
}
function rerenderTip(id) {
  const old = $("report").querySelector(".tip");
  const holder = document.createElement("div");
  holder.innerHTML = tipCard(id, { saveBtn: true });
  old.replaceWith(holder.firstElementChild);
  bindTip(id);
}

/* ---------- fake-door paywall ---------- */
function fakeDoor(id) {
  const n = store.get("taps", 0) + 1;
  store.set("taps", n);
  const open = () => { unlocked.add(id); store.set("unlocked", [...unlocked]); renderReport(id); };
  if (window.GILJI && GILJI.isLive(id) && !writer()[id]) { GILJI.unlock(id, open); return; }
  const freeSheet = () => {
    sheet(`<h3>${T({ ko: "베타 동안은 무료예요", en: "Free during the beta" })}</h3>
      <p>${T({ ko: "정식으로 열면 한 집에 $1 정도를 생각하고 있어요. 열어 보신 횟수를 이 브라우저에만 기록해요.",
        en: "After launch we're thinking of about $1 per home. We count how many times you open it, in this browser only." })}</p>
      <p class="count">${T({ ko: "이 브라우저에서 연 횟수", en: "Times opened in this browser" })}: ${n}</p>
      <button class="btn accent block" id="ok">${T({ ko: "전체 해설 열기", en: "Open the full reading" })}</button>`, freeSheet);
    $("ok").addEventListener("click", () => { closeSheet(); open(); });
  };
  freeSheet();
}

/* ---------- compare ---------- */
let picked = new Set();
function openCompare(fromId) {
  picked = new Set([fromId, ...ORDER.filter((k) => k !== fromId)].slice(0, 3));
  renderCompare(); show("compare");
}
function renderCompare() {
  const ids = ORDER.filter((k) => picked.has(k));
  const best = Math.max(...ids.map((k) => R[k].score.stars));   // one rating for every home (v0.8)
  const row = (label, f) => `<tr><th>${label}</th>${ids.map((k) => `<td>${f(R[k], k)}</td>`).join("")}</tr>`;
  $("compare").innerHTML = `
    <div class="card"><h2>${T({ ko: "집 비교", en: "Compare homes" })} <small>${T({ ko: "최대 세 곳", en: "Up to three" })}</small></h2>
      <div class="pick">${ORDER.map((k) => `<button aria-pressed="${picked.has(k)}" data-id="${k}">${shortName(k)}</button>`).join("")}</div>
      ${ids.length < 2 ? `<p class="none" style="margin-top:12px">${T({ ko: "두 곳 이상 골라 주세요.", en: "Pick two or more." })}</p>` : `
      <div class="cmp"><table>
        <thead><tr><th></th>${ids.map((k) => `<th>${shortName(k)}</th>`).join("")}</tr></thead>
        <tbody>
          ${row(T({ ko: "별점", en: "Stars" }), (r) => `<span class="big ${r.score.stars === best ? "best" : ""}">★ ${r.score.stars}<small style="font-size:13px;color:var(--ink-3)">/5</small></span>${r.score.stars === best ? `<span class="tag">${T({ ko: "가장 높아요", en: "Highest" })}</span>` : ""}`)}
          ${row(T({ ko: "등급", en: "Grade" }), (r) => `<b class="serif">${gradeName(r.score.grade)}</b>`)}
          ${Object.keys(GIUN).map((g) => row(T(GIUN[g]), (r) => `<span class="stars" style="letter-spacing:0">${stars(r.giun.find((x) => x.key === g).stars)}</span>`)).join("")}
          ${row(T({ ko: "물길", en: "Water" }), (r) => `${riverName(r.score.components.deuksu.facts)}<br><span style="color:var(--ink-3);font-size:12px">${bend(r.score.components.deuksu.facts.bend)}</span>`)}
          ${row(T({ ko: "살펴볼 점", en: "To watch" }), (r) => r.sal.length ? r.sal.map(salName).join("<br>") : T({ ko: "없음", en: "None" }))}
          ${row(T({ ko: "보완법", en: "Fixes" }), (r) => T({ ko: `${TIPS.siteTips(r).length}가지`, en: `${TIPS.siteTips(r).length}` }))}
        </tbody></table></div>`}
    </div>
    <p class="disclaimer">${T({ ko: "별점은 참고용이에요. 어느 집이 좋을지는 직접 판단해 주세요.", en: "Stars are for reference. Which home is right for you is your call." })}<br>${T(DISCLAIMER)}</p>
    <div class="actions"><button class="btn ghost" id="cmp-home">${T({ ko: "처음으로", en: "Home" })}</button><button class="btn ghost" id="cmp-back">${T({ ko: "보고서로", en: "Back to the report" })}</button></div>`;
  $("compare").querySelector(".pick").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.id;
    if (picked.has(k)) picked.delete(k); else if (picked.size < 3) picked.add(k);
    renderCompare();
  });
  $("cmp-home").addEventListener("click", () => show("home"));
  $("cmp-back").addEventListener("click", () => show("report"));
}

/* ---------- about + sheet ---------- */
const ABOUT = {
  ko: `<h3 style="margin-top:0">형기론 한 가지로 읽어요</h3>
    <p>산과 물, 땅의 모양으로 터를 읽는 형기론(形氣論)만 써요. 나경과 공식으로 보는 이기론은 다루지 않아요.</p>
    <h3>같은 집은 같은 별점</h3>
    <p>모든 집을 같은 별 다섯 개로 매겨요. 땅이 평평한 집도 같은 별점이에요. 별점은 정해진 규칙이 매기고, 해설은 그 결과를 풀어 쓸 뿐 별점을 바꾸거나 새 판단을 더하지 않아요.</p>
    <h3>무엇을 보나요</h3>
    <p>반경 3.5km의 지형으로 현무·주작·청룡·백호와 바람길을, 물길의 굽음으로 득수를, 주변 도로·고가·송전선·묘지로 살펴볼 점을 찾아요.</p>
    <h3>터주와 흥이</h3>
    <p>두꺼비 터주는 집터를 지키는 터줏대감이에요. 산과 물을 읽고 이 집의 이야기를 들려줘요. 제비 흥이는 흥부에게 박씨를 물어다 준 제비처럼, 매일 이 집에 맞는 박씨(오늘의 보완법) 하나를 물어 와요.</p>
    <h3>보완법</h3>
    <p>터의 모자란 곳을 나무, 가구, 색, 배치로 채우는 방법이에요. 풍수에서는 비보(裨補)라고 불러요.</p>
    <h3>데이터</h3>`,
  en: `<h3 style="margin-top:0">One school: the landform school</h3>
    <p>We read a site only by the shape of its hills, water and land, the landform school of feng shui (hyeonggiron, 形氣論). We don't use the compass-and-formula school.</p>
    <h3>Same home, same stars</h3>
    <p>Every home is rated on the same five stars, homes on level land too. A fixed set of rules gives the stars. The written reading only explains that result. It never changes the rating or adds new judgments.</p>
    <h3>What we look at</h3>
    <p>From the land within 3.5 km we read the four sides (back, front, left and right) and the wind. From how the water bends we read the water. And we look for things to watch nearby, like roads, overpasses, power lines and cemeteries.</p>
    <h3>Teoju and Heungi</h3>
    <p>Teoju the toad is the guardian spirit of the home's land. He reads the hills and water and tells you this home's story. Heungi the swallow is like the swallow in the Korean folk tale who brought Heungbu a gourd seed: every day she brings one seed, today's fix, made for this home.</p>
    <h3>Fixes</h3>
    <p>Ways to make up for what the land lacks, with plants, furniture, color and layout. Feng shui calls this bibo (裨補).</p>
    <h3>Data</h3>`,
};
function openAbout() {
  sheet(`<div class="about">${ABOUT[window.GILJI_LANG] || ABOUT.ko}
    <p>Copernicus GLO-30 (© DLR e.V., © Airbus Defence and Space GmbH, provided under COPERNICUS by the EU and ESA) · © OpenStreetMap contributors (ODbL)</p>
    <p style="margin-top:14px;font-size:12px;color:var(--ink-3)">${T(DISCLAIMER)}</p>
    <button class="btn block" id="ok" style="margin-top:12px">${T({ ko: "닫기", en: "Close" })}</button></div>`, openAbout);
  $("ok").addEventListener("click", closeSheet);
}
window.giljiShow = (id) => show(id);
window.giljiOpen = (id) => { dayOffset = 0; renderReport(id); show("report"); };
window.giljiSheet = (html, redraw) => sheet(html, redraw);
window.giljiCloseSheet = () => closeSheet();
window.giljiHint = (text, err) => setHint(text, err);
// redraw: how to draw the open sheet again in the other language (keeps its state, never re-sends)
let sheetRedraw = null;
function sheet(html, redraw) {
  sheetRedraw = redraw || null;
  const keepScroll = !$("modal").classList.contains("hidden") && redraw ? $("sheet").scrollTop : 0;
  $("sheet").innerHTML = html; $("modal").classList.remove("hidden");
  $("sheet").scrollTop = keepScroll;
}
function closeSheet() { $("modal").classList.add("hidden"); sheetRedraw = null; }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- language switch: redraw what is on screen, in place ---------- */
I18N.onLang(() => {
  applyStatic();
  renderHome();
  renderSavedTip();
  if (screen === "reading" && current && SHORT[current]) $("reading-addr").textContent = shortName(current);
  if (screen === "compare") renderCompare();
  if (screen === "report" && current && R[current]) {
    // keep the scroll spot and any folded sections the reader had opened
    const y = window.scrollY;
    const open = [...$("report").querySelectorAll("details")].map((d) => d.open);
    const typed = $("chat-q") ? $("chat-q").value : "";
    renderReport(current);
    $("report").querySelectorAll("details").forEach((d, i) => { if (open[i]) d.open = true; });
    if ($("chat-q")) $("chat-q").value = typed;
    window.scrollTo(0, y);
  }
  if (sheetRedraw && !$("modal").classList.contains("hidden")) sheetRedraw();
});

applyStatic();
renderSavedTip();
</script>
</body>
</html>
