<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박씨 Bakseed · 클로즈드 베타</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/icon-64.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  color-scheme: light;
  --paper: #f5f6f8;          /* app background: soft gray, like Naver / Toss */
  --card: #ffffff;
  --ink: #191f28;
  --ink-2: #4e5968;
  --ink-3: #8b95a1;
  --line: #e9ecef;
  --accent: #f0675c;         /* warm coral */
  --accent-soft: #fff0ee;
  --star: #f5b400;           /* stars and the rating ring: warm gold, not the coral accent */
  --sage: #20a97a;           /* jade */
  --sage-soft: #e9f8f1;
  --wood: #20a97a;
  --fire: #f0675c;
  --earth: #e8a93b;
  --metal: #a3a9b3;
  --water: #4c7bd9;
  --shadow: 0 2px 14px rgba(25,31,40,.05);
  --display: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 16px/1.65 var(--display); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: var(--display); }
.wrap { max-width: 460px; margin: 0 auto; padding: 0 16px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin: 0 -16px; position: sticky; top: 0; z-index: 5; background: rgba(245,246,248,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.mark { width: 40px; height: 36px; flex: none; object-fit: contain; }
.brand b { font: 800 20px var(--display); letter-spacing: -.5px; white-space: nowrap; }
.brand { flex: none; }
.bar-right { flex-shrink: 1; }
.demo-tag { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
html[lang="en"] .brand b.ko-name { display: none; }
.demo-tag { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 10px; font-weight: 600; white-space: nowrap; }
.bar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand .en { font: 800 19px var(--display); color: var(--ink); letter-spacing: -.3px; white-space: nowrap; }
/* 한국어 / ENG toggle */
.lang { display: inline-flex; flex: none; background: var(--card); border-radius: 99px; padding: 2px; box-shadow: var(--shadow); }
.lang button { border: 0; background: none; min-height: 36px; padding: 0 11px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
@media (max-width: 360px) { .demo-tag { display: none; } }

/* home */
.hero { padding: 28px 18px 24px; text-align: center; margin-top: 4px; border-radius: 26px; background: linear-gradient(160deg, #fff4ee 0%, #fdeef3 45%, #eef6ff 100%); }
.hero h1 { font: 800 26px/1.38 var(--display); margin: 0 0 10px; letter-spacing: -.6px; }
.hero p { color: var(--ink-2); margin: 0; font-size: 15px; }
.search { display: flex; gap: 8px; margin-top: 24px; }
.search input {
  flex: 1; min-width: 0; padding: 15px 16px; border-radius: 14px; border: 1.5px solid var(--line); font-size: 16px;
  background: var(--card); color: var(--ink); font: inherit;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#sugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 15; margin: 0; padding: 6px 0; list-style: none; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(25,31,40,.16); }
#sugg li { padding: 10px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
#sugg li b { font-weight: 600; font-size: 15px; color: var(--ink); }
#sugg li span { font-size: 13px; color: var(--ink-3); }
#sugg li.on, #sugg li:hover { background: #f4f5f7; }
#sugg li.credit { cursor: default; padding: 6px 16px 2px; font-size: 11px; color: var(--ink-3); background: none; }
.btn {
  border: 0; border-radius: 14px; padding: 14px 18px; background: var(--accent); color: #fff;
  font-weight: 700; white-space: nowrap;
}
.btn.accent { background: var(--accent); color: #fff; }
.btn.ghost { background: #f2f4f6; color: var(--ink-2); border: 0; }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 99px; }
.btn.block { width: 100%; }
.hint { font-size: 13px; color: var(--ink-3); margin: 10px 4px 0; min-height: 20px; }
.hint.err { color: var(--accent); }
.section-label { font-size: 17px; font-weight: 700; color: var(--ink); margin: 30px 4px 12px; }
.sample { display: grid; gap: 8px; }
.sample button {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  background: var(--card); border: 0; border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow);
}
.sample small { display: block; color: var(--ink-3); font-size: 12px; }
.sample .arrow { color: var(--ink-3); }
.ladder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ladder div { background: var(--card); border: 0; box-shadow: var(--shadow); border-radius: 16px; padding: 12px 8px; text-align: center; }
.ladder b { display: block; font: 700 15px var(--display); }
.ladder span { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.45; margin-top: 4px; }
.ladder em { display: block; font-style: normal; font-size: 12px; color: var(--accent); margin-top: 4px; font-weight: 700; }

/* reading */
.reading { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 18px; }
.bob { animation: bob 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bob { 50% { transform: translateY(-6px) scaleY(1.03); } }
.flap { animation: flap 1.6s ease-in-out infinite; }
@keyframes flap { 50% { transform: translateY(-4px) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { .bob, .flap { animation: none; } }
.duo { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin-bottom: 12px; }
.duo .flap { margin-bottom: 60px; }
.says { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: end; margin-top: 16px; }
.bubble { position: relative; background: #f2f4f6; border-radius: 16px 16px 16px 4px; padding: 12px 14px; font: 700 16px/1.55 var(--display); }
.tip .when { align-items: center; }
.tip .who { display: flex; align-items: center; gap: 6px; }
.tip .who svg { background: #fbf3e4; border-radius: 12px; padding: 3px 4px; flex: none; }
.reading ol { list-style: none; padding: 0; margin: 0; color: var(--ink-3); font-size: 14px; }
.reading li { transition: color .3s; }
.reading li.on { color: var(--ink); }
.reading li.done { color: var(--sage); }

/* cards */
.card { background: var(--card); border: 0; border-radius: 22px; padding: 22px 20px; margin-top: 14px; box-shadow: var(--shadow); }
.card h2 { font: 700 18px var(--display); margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card h2 small { font: 400 12px var(--display); color: var(--ink-3); }
.addr { font-size: 13px; color: var(--ink-2); }
.top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin-top: 18px; }
.top .rate-stars { font-size: 26px; letter-spacing: 4px; color: var(--star); line-height: 1; margin-top: 4px; }
.top .rate-stars i { color: var(--line); font-style: normal; }
.top .rate-stars .sp { display: inline-block; animation: starpop .45s both; }
.top .rate-stars .sp.off { color: var(--line); }
@keyframes starpop { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
/* 내 카드 (one idea per card) */
.kc-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 4px 8px; }
.kc-head h2 { font: 800 19px var(--display); margin: 0; }
.kc-head small { color: var(--ink-3); font-weight: 500; font-size: 14px; }
.kc-head button { border: 0; background: none; color: var(--accent); font: 700 15px var(--display, inherit); padding: 8px 4px 8px 12px; }
.kc-chips { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.kc-chips button { border: 0; border-radius: 99px; padding: 8px 14px; background: #fff; color: var(--ink-2); font: 600 13px var(--display, inherit); white-space: nowrap; }
.kc-chips button.on { background: var(--ink); color: #fff; }
#cards-feed { display: flex; flex-direction: column; gap: 12px; }
#cards-feed .card { margin: 0; }
.kc { position: relative; display: flex; flex-direction: column; width: 100%; text-align: left; border: 0; padding: 0; background: #fff; border-radius: 22px; overflow: hidden;
  color: var(--ink); font: inherit; box-shadow: 0 2px 12px rgba(25,31,40,.05); cursor: pointer; animation: kcrise .5s both; }
.kc:active { transform: scale(.985); }
.kc-block { animation: kcrise .5s both; }
.kc-pic { display: block; overflow: hidden; background: #eef3f6; }
.kc-pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.kc-big .kc-pic { height: 158px; }
.kc-big .kc-pic img { animation: kcfloat 7s ease-in-out infinite; }
.kc-side { flex-direction: row; }
.kc-side.r { flex-direction: row-reverse; }
.kc-side .kc-pic { width: 40%; flex: none; min-height: 140px; }
.kc-half .kc-pic { height: 96px; }
.kc-body { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px 16px; min-width: 0; }
.kc-half .kc-body { padding: 10px 13px 13px; }
.kc-tag { font-size: 12px; font-weight: 700; }
.kc-tag.good { color: #1f9d55; } .kc-tag.weak { color: var(--accent); } .kc-tag.know { color: #b26b00; }
.kc-title { font: 800 17px/1.35 var(--display); }
.kc-big .kc-title { font-size: 19px; }
.kc-half .kc-title { font-size: 15px; }
.kc-num { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kc-num b { font: 800 28px/1.15 var(--display); }
.kc-num span { font-size: 13px; color: var(--ink-3); }
.kc-half .kc-num b { font-size: 22px; }
.kc-lines { font-size: 14px; line-height: 1.55; color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kc-half .kc-lines { font-size: 12.5px; -webkit-line-clamp: 2; }
.kc-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@keyframes kcrise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes kcfloat { 0%, 100% { transform: scale(1.03); } 50% { transform: scale(1.07) translateY(-3px); } }
/* a card opened, and card editing (in the sheet) */
.kd .kd-pic { width: calc(100% + 40px); margin: -8px -20px 12px; height: 180px; object-fit: cover; display: block; }
.kd h3 { margin: 4px 0 6px; font-size: 21px; }
.kd p { margin: 0 0 6px; line-height: 1.6; }
.kd-num { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 8px; } .kd-num b { font: 800 30px var(--display); } .kd-num span { color: var(--ink-3); font-size: 14px; }
.kd-actions { display: flex; gap: 8px; margin-top: 14px; }
.kd-actions button { flex: 1; height: 48px; border-radius: 14px; border: 0; background: #f2f4f6; color: var(--ink-2); font: 700 14px var(--display, inherit); }
.kd-actions .kd-star { background: var(--accent-soft); color: var(--accent); }
.ke-top { display: flex; justify-content: space-between; align-items: center; }
.ke-top h3 { margin: 0; }
.ke-list { max-height: 56vh; overflow-y: auto; margin: 8px -4px; padding: 0 4px; display: flex; flex-direction: column; gap: 6px; }
.ke-sec { font-size: 12px; font-weight: 700; color: var(--ink-3); margin: 8px 2px 0; }
.ke-row { display: flex; align-items: center; gap: 2px; background: #f6f7f9; border-radius: 14px; padding: 4px 4px 4px 12px; }
.ke-row.off { opacity: .7; }
.ke-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ke-row button:not(.btn) { width: 38px; height: 40px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; font-size: 18px; }
.ke-row button[data-act="star"].on { color: var(--star); }
.top .meta { max-width: 320px; }
.dial { position: relative; width: 150px; height: 150px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .num b { font: 800 56px/1 var(--display); }
.dial .num span { font-size: 12px; color: var(--ink-3); }
.dial .num span.stars { font-size: 12px; letter-spacing: 1px; margin-top: 4px; color: var(--star); }
.st { color: var(--star); font-style: normal; }
.facts b small { font-size: .6em; color: var(--ink-3); font-weight: 600; }
.level-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.level-chips .chip { background: var(--paper); color: var(--ink-2); font-size: 12px; }
.level-chips .chip.warn { color: var(--accent); }
.grade { display: inline-block; font: 700 15px var(--display); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 14px; }
.headline { font: 700 17px/1.55 var(--display); margin: 10px 0 0; }
.meta { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* today's tip */
.tip { background: var(--sage-soft); border-color: transparent; }
.tip .when { font-size: 12px; color: var(--sage); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.tip h3 { font: 700 19px/1.45 var(--display); margin: 8px 0 6px; }
.tip p { margin: 0; font-size: 14px; color: var(--ink-2); }
/* "US living" card: a different look from the 풍수 cards, so it never reads as part of the score */
.usl { border: 1px dashed var(--line); background: transparent; }
.chat .msgs { display: grid; gap: 8px; }
.chat .q { justify-self: end; max-width: 85%; background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.6; }
.chat .a { max-width: 92%; background: #f2f4f6; padding: 10px 13px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 1.75; }
.chat .a.wait { color: var(--ink-3); }
.chat .a.err { color: var(--accent); }
.chat .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chat .facts span { font-size: 12px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.chat .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chat .sugg .btn { text-align: left; }
.chat .chat-note { font-size: 12px; color: var(--ink-3); margin: 8px 2px 0; }
.usl .usl-note { font-size: 13px; color: var(--ink-3); margin: -4px 0 12px; }
.usl .it { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.usl .k { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; margin-top: 3px; }
.usl .k.good { background: var(--card); color: var(--sage); }
.usl .k.mixed { background: var(--card); color: var(--ink-2); }
.usl .k.know { background: var(--card); color: var(--accent); }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--card); color: var(--sage); }
.tip .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.tip .btn.ghost { background: var(--card); border-color: transparent; }

/* map */
.map .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: 0; }
.leaf { height: 380px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); z-index: 0; }
.leaf .peak { white-space: nowrap; }
.leaf .peak i { display: block; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid; transform: translate(-50%, -100%); filter: drop-shadow(0 0 1px #fff); }
.leaf .peak span { display: block; transform: translate(-50%, -6px); font: 700 11px var(--display); color: #2e2925; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.leaf .face-arrow span { display: block; color: #b8684e; font-size: 16px; line-height: 18px; text-align: center; }
.leaf .home-pin img { filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
.leaf .sal-mark { background: #c0392b; color: #fff; border-radius: 50%; font: 700 13px/20px sans-serif; text-align: center; box-shadow: 0 0 0 2px #fff; }
.watch-note { color: #c0392b; }
.sasinsa .side { font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 4px; }
.water-note { font-size: 13px; color: var(--ink-2); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.sasinsa { display: grid; gap: 6px; margin-top: 12px; font-size: 14px; }
.sasinsa div { display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.sasinsa b { font-family: var(--display); }

/* detail components (folded) */
details.card > summary { list-style: none; cursor: pointer; font: 700 16px var(--display); display: flex; justify-content: space-between; align-items: center; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary span { font: 400 12px var(--display); color: var(--ink-3); }
details.card[open] > summary { margin-bottom: 14px; }
details.card > summary .fold::after { content: "⌄"; display: inline-block; margin-left: 6px; transition: transform .2s; }
details.card[open] > summary .fold::after { transform: rotate(180deg); }
.card.foldable > h2 { cursor: pointer; }
.card.foldable > h2::after { content: "⌄"; font: 400 14px var(--display); color: var(--ink-3); margin-left: auto; transition: transform .2s; }
.card.foldable:not(.closed) > h2::after { transform: rotate(180deg); }
.card.closed > h2 { margin-bottom: 0; }
.card.closed > :not(h2) { display: none !important; }
.link-btn { border: 0; background: none; padding: 4px 0 0; color: var(--accent); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.dirs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 260px; margin: 8px auto 0; }
.dirs .dir { min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-weight: 700; font-size: 15px; color: var(--ink); }
.dirs .dir.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.dirs .dir:disabled { opacity: .5; }
.dir-home { display: grid; place-items: center; font-size: 24px; }
.compass { text-align: center; margin-top: 10px; }
.door-busy { text-align: center; padding: 12px 0 8px; }
.door-busy .char-wrap { display: inline-block; margin-bottom: 6px; }
.door-busy h3 { margin: 6px 0 4px; }
#cam { position: fixed; inset: 0; z-index: 1000; background: #000; color: #fff; }
#cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cam.no-video video { display: none; }
#cam .cam-top { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 14px) 0 14px; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); text-align: center; }
#cam .cam-top p { margin: 10px 16px 0; font-size: 15px; }
#cam .cam-tape { position: relative; height: 34px; overflow: hidden; }
#cam .cam-tape span { position: absolute; top: 18px; width: 2px; height: 10px; margin-left: -1px; background: rgba(255,255,255,.7); font-size: 0; }
#cam .cam-tape span.big { top: 0; width: auto; white-space: nowrap; height: auto; background: none; transform: translateX(-50%); font: 700 17px var(--display); }
#cam .cam-mark { width: 0; height: 0; margin: 2px auto 0; border: 8px solid transparent; border-bottom-color: #f5b400; border-top: 0; }
#cam .cam-cross { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 2px solid rgba(255,255,255,.85); border-radius: 50%; }
#cam .cam-cross::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #f5b400; }
#cam .cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 16px calc(env(safe-area-inset-bottom) + 20px); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.7)); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#cam .cam-dir { margin: 0; font: 800 30px var(--display); text-shadow: 0 1px 6px rgba(0,0,0,.5); }
#cam .cam-bottom .btn { min-width: 200px; }

<script>
/* Auto-update: phones and browsers keep an old copy of this page for a while after a publish.
   deploy/publish-page.sh stamps PAGE_VERSION here and writes version.json. On opening, a newer
   version reloads the page at once (nothing has been touched yet). Coming back to the app later,
   it offers a button instead of reloading under the person. Each version is tried once. */
const PAGE_VERSION = "20261121074718";
(function () {
  if (PAGE_VERSION === "dev") return;
  let last = 0;
  async function check(onOpen) {
    if (Date.now() - last < 60000) return;
    last = Date.now();
    let v;
    try { v = (await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json()).v; } catch (_) { return; }
    if (!v || v <= PAGE_VERSION) return;
    let tried = null;
    try { tried = sessionStorage.getItem("gilji.reloadedTo"); } catch (_) {}
    const go = () => {
      try { sessionStorage.setItem("gilji.reloadedTo", v); } catch (_) {}
      location.replace(location.pathname + "?v=" + v + location.hash);
    };
    if (onOpen && tried !== v) { go(); return; }
    if (document.getElementById("new-version")) return;
    const b = document.createElement("button");
    b.id = "new-version"; b.type = "button";
    b.textContent = window.GILJI_I18N.t({ ko: "새 버전이 나왔어요 · 새로고침", en: "A fresh version is ready · tap to update" });
    b.addEventListener("click", go);
    document.body.appendChild(b);
  }
  check(true);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(false); });
})();

function countUp(el) {      // the score climbs with the ring
  const end = parseInt(el.textContent, 10);
  if (!(end > 0) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 1000;
  const step = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  el.textContent = "0"; requestAnimationFrame(step);
}
function dial(n) {      // one rating for every home: n of 5 stars (rules v0.8)

    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--star)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}" style="transition:stroke-dashoffset 1s ease"/>
  </svg><div class="num" aria-hidden="true"><b>${n}</b><span>/ 5</span></div></div>
  <div class="rate-stars" aria-hidden="true">${[1, 2, 3, 4, 5].map((i) => `<span class="sp${i > n ? " off" : ""}" style="animation-delay:${(0.75 + i * 0.12).toFixed(2)}s">★</span>`).join("")}</div>`;

function factLine(key, f) {
  const en = isEn();
  switch (key) {
    case "hyeonmu": return en ? `Rises ${f.rise_m} m behind · blocks ${f.back_horizon_deg}° of the sky behind`
      : `뒤로 ${f.rise_m}m 솟음 · 뒤 하늘 ${f.back_horizon_deg}° 가림`;
    case "jujak": return en
      ? (f.ansan ? `Low hill in front: ${place(f.ansan_name) || ""}` : "No low hill in front") + ` · blocks ${f.front_horizon_deg}° of the sky in front` + (f.front_overbearing ? " · the hill in front is taller than the back" : "")
      : (f.ansan ? `앞의 낮은 산 ${f.ansan_name || ""}` : "앞의 낮은 산 없음") + ` · 앞 하늘 ${f.front_horizon_deg}° 가림` + (f.front_overbearing ? " · 앞산이 뒷산보다 높음" : "");
    case "enclosure": return en
      ? `Left ${f.cheongryong_deg}° · right ${f.baekho_deg}°` + (f.weak_side ? ` · ${T(SIDE[f.weak_side]).toLowerCase()} side weak` : " · both sides open")

    case "jangpung": {  // rules v0.2: the cold wind is regional (Korea: 북서풍)
      const IX = { N: 0, NE: 1, E: 2, SE: 3, S: 4, SW: 5, W: 6, NW: 7 };
      const w = DIR8[en ? "en" : "ko"][IX[f.wind_from] != null ? IX[f.wind_from] : 7];
      return en ? `Cold-wind side (${w}) ${f.wind_open ? "open" : "sheltered"} · ${f.mean_deg}° on average all around`
        : `찬바람(${w}) 쪽이 ${f.wind_open ? "열림" : "막힘"} · 사방 평균 ${f.mean_deg}°`;
    }
    case "deuksu": return `${riverName(f)} ${bend(f.bend)}` + (f.water_name && f.water_name !== f.bend_river
      ? (en ? ` · nearest water ${place(f.water_name)} ${f.distance_m} m` : ` · 가장 가까운 물 ${f.water_name} ${f.distance_m}m`)
      : f.bend_river ? (en ? ` · ${f.distance_m} m` : ` · ${f.distance_m}m`) : "");
    case "jwahyang":  // rules v0.2: winter sun, not the door bearing
      return en
        ? (f.sun_lost_h >= 0.5 ? `Hills block the winter-solstice sun for ${f.sun_lost_h} h` : "Hills barely block the winter-solstice sun")
          + (f.faces_sun ? " · faces south" : "") + (f.off_south_deg >= 22.5 ? ` · the door is ${f.off_south_deg}° off due south` : "")
        : (f.sun_lost_h >= 0.5 ? `동짓날 해를 ${f.sun_lost_h}시간 가림` : "동짓날 해를 거의 안 가림")
          + (f.faces_sun ? " · 남쪽을 바라봄" : "") + (f.off_south_deg >= 22.5 ? ` · 현관은 정남에서 ${f.off_south_deg}° 비낌` : "");
    case "stability": return en ? `Ground slope ${f.slope_deg}°` : `대지 경사 ${f.slope_deg}°`;
  }
  return "";
}

const SIDE = { hyeonmu: { ko: "뒤", en: "Back" }, jujak: { ko: "앞", en: "Front" },
               cheongryong: { ko: "왼쪽", en: "Left" }, baekho: { ko: "오른쪽", en: "Right" } };
// 오방색: 현무 black, 주작 red, 청룡 blue-green, 백호 white
const OH_COLOR = { wood: "#6f8f74", fire: "#c9705a", earth: "#c9a15a", metal: "#a3a7ad", water: "#5b6f8f" };

function verdict(r, k) {
  const c = r.score.components;
  if (k === "hyeonmu") return c.hyeonmu.score >= 80 ? T({ ko: "든든해요", en: "Strong" })
    : c.hyeonmu.score >= 55 ? T({ ko: "보통이에요", en: "So-so" }) : T({ ko: "약해요", en: "Not much there" });
  if (k === "jujak") {
    const f = c.jujak.facts;
    return f.front_overbearing ? T({ ko: "앞산이 뒤보다 높아요", en: "Taller than the hill behind" })
      : f.ansan ? T({ ko: "낮은 산이 마주 봐요", en: "A low hill faces it" }) : T({ ko: "트였어요", en: "Open" });
  }
  const deg = c.enclosure.facts[k === "cheongryong" ? "cheongryong_deg" : "baekho_deg"];
  return deg >= 3 ? T({ ko: "감싸요", en: "Wraps around" }) : deg >= 1.5 ? T({ ko: "낮아요", en: "Low" }) : T({ ko: "트였어요", en: "Open" });
}

// point at a bearing (deg, clockwise from north) and distance (m) from lat/lng
function dest(lat, lng, b, d) {
  const rad = (b * Math.PI) / 180;
  return [lat + (d * Math.cos(rad)) / 111320, lng + (d * Math.sin(rad)) / (111320 * Math.cos((lat * Math.PI) / 180))];
}

let leafMap = null;
function drawMap(id) {
  const el = $("sasinsa-map");
  if (!el || !window.L) return;
  if (leafMap) { leafMap.remove(); leafMap = null; }
  const r = R[id], lat = r.site.lat, lng = r.site.lng, facing = r.site.facing_deg;
  const m = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  m.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  leafMap = m;
  // quiet light-gray base (Esri Light Gray Canvas) so the home, water and hills stand out
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  L.tileLayer(ESRI + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16, attribution: "Esri, HERE, Garmin, © OpenStreetMap contributors",
  }).addTo(m);
  L.tileLayer(ESRI + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, opacity: .7 }).addTo(m);

  // the area the engine read, as one faint ring; the four sides are listed under the map
  const RAD = 3300;
  L.circle([lat, lng], { radius: RAD, color: "#f0675c", weight: 1, opacity: .45, dashArray: "3 6", fill: false, interactive: false }).addTo(m);

  // river and overpass lines from the engine's own map data
  const lay = (window.PUNGSU_MAP || {})[id] || {};
  const d = r.score.components.deuksu.facts;
  (lay.river || []).forEach((line, i) => {
    const pl = L.polyline(line, { color: "#3b6ea8", weight: 5, opacity: .85 }).addTo(m);
    if (i === 0) pl.bindTooltip(`${riverName(d)} · ${bend(d.bend)}`, { sticky: true });
  });
  const ov = r.sal.find((x) => x.id === "overpass");
  (lay.overpass || []).forEach((line, i) => {
    L.polyline(line, { color: "#c0392b", weight: 6, opacity: .9, dashArray: "8 6" }).addTo(m);
    if (i === 0 && ov) {
      // label the far end of the line so it doesn't sit on top of the house
      const far = lay.overpass.flat().reduce((a, q) => (m.distance(q, [lat, lng]) > m.distance(a, [lat, lng]) ? q : a));
      L.marker(far, { icon: L.divIcon({ className: "sal-mark", html: "!", iconSize: [20, 20], iconAnchor: [10, 10] }) })
        .bindTooltip(isEn() ? `${place(ov.evidence.road)} overpass · ${ov.evidence.distance_m} m` : `${ov.evidence.road} 고가 · ${ov.evidence.distance_m}m`).addTo(m);
    }
  });

  // named hills the engine read
  r.peaks.filter((p) => p.name).forEach((p) => {
    L.marker(dest(lat, lng, p.bearing_deg, p.distance_m), { icon: L.divIcon({ className: "peak",
      html: `<i style="border-bottom-color:${OH_COLOR[p.shape]}"></i><span>${place(p.name)}</span>`, iconSize: null }) })
      .bindTooltip(`${place(p.name)} · ${Math.round(p.elev_m)}m · ${(p.distance_m / 1000).toFixed(1)}km`).addTo(m);
  });

  // the house: 터주 with an arrow for the way it faces
  const tip = dest(lat, lng, facing, 520);
  L.polyline([[lat, lng], tip], { color: "#b8684e", weight: 4, opacity: .95, interactive: false }).addTo(m);
  L.marker(tip, { interactive: false, icon: L.divIcon({ className: "face-arrow",
    html: `<span style="transform:rotate(${facing}deg)">▲</span>`, iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(m);
  L.marker([lat, lng], { icon: L.divIcon({ className: "home-pin", html: CH.toad(40), iconSize: [34, 46], iconAnchor: [17, 44] }) })
    .bindTooltip(T({ ko: "이 집 · 화살표가 현관 방향", en: "This home · the arrow shows the door's direction" })).addTo(m);

  const E = RAD * 1.04;
  const b = L.latLngBounds([dest(lat, lng, 0, E), dest(lat, lng, 180, E), dest(lat, lng, 90, E), dest(lat, lng, 270, E)]);
  m.fitBounds(b, { padding: [2, 2] });
  setTimeout(() => m.invalidateSize(), 80);
}

// The separate "US living" card (api/us_living.py): what US buyers value; never part of the 풍수 score.
/* 해와 향 (household feedback, Nov 20): which way the big windows face matters differently by climate.
   US homes put most glass on the front (door) and back (yard) sides. Hot places: afternoon sun from the
   west is the costly one, a north-south front/back is easiest. Cold places: a side facing south warms the
   home in winter. Mild coast: small effect. Climate is a rough guess from where the home is (Texas; in
   California, mountains above 1,200 m, or more than 50 km from the ocean). Never part of the 풍수 stars. */
const CA_COAST = [[41.99,-124.21],[40.8,-124.16],[40.44,-124.4],[39.8,-123.85],[38.95,-123.73],[38.3,-123.05],
  [37.8,-122.51],[37.5,-122.5],[36.95,-122.03],[36.6,-121.9],[36.3,-121.9],[35.65,-121.25],[35.15,-120.65],
  [34.45,-120.45],[34.4,-119.7],[34.03,-118.8],[33.75,-118.4],[33.55,-117.8],[33.2,-117.38],[32.53,-117.12]];
function climateOf(site) {
  const { lat, lng } = site, el = site.elevation_m || 0;
  if (lng > -107 && lng < -93 && lat < 36.6) return "hot_tx";
  if (lng < -114 && lat > 32.4 && lat < 42.1) {
    if (el >= 1200) return "cold";
    const km = Math.min(...CA_COAST.map(([a, b]) => Math.hypot((a - lat) * 111, (b - lng) * 111 * Math.cos(lat * Math.PI / 180))));
    return km > 50 ? "hot_ca" : "mild";
  }
  return null;
}
function sunNote(r) {
  const s = r.site || {}, cl = climateOf(s);
  if (!cl || s.facing_deg == null) return null;
  const f = ((s.facing_deg % 360) + 360) % 360, b = (f + 180) % 360;
  const near = (a, t) => Math.abs(((a - t + 540) % 360) - 180) <= 45;
  const dir = (a) => { const i = Math.round(a / 45) % 8; return { ko: DIR8.ko[i] + "쪽", en: DIR8.en[i] }; };
  const side = (which) => {
    const d = dir(which === "front" ? f : b);
    return which === "front" ? { ko: `앞(현관 쪽)이 ${d.ko}을`, en: `The front (door side) faces ${d.en}` }
                             : { ko: `뒤(뒷마당 쪽)가 ${d.ko}을`, en: `The back (yard side) faces ${d.en}` };
  };
  const west = near(f, 270) ? "front" : near(b, 270) ? "back" : null;
  const south = near(f, 180) ? "front" : near(b, 180) ? "back" : null;
  const lead = { ko: "해와 향 · ", en: "Sun and facing · " };
  const say = (kind, ko, en) => ({ kind, text: T(lead) + T({ ko, en }) });
  if (cl === "hot_tx" || cl === "hot_ca") {
    const where = cl === "hot_tx" ? { ko: "텍사스처럼 더운 곳에서는", en: "In a hot place like Texas," }
                                  : { ko: "여름이 덥고 건조한 내륙에서는", en: "Inland, where summers are hot and dry," };
    if (west) { const w = side(west); return say("know",
      `${w.ko} 봐요. ${where.ko} 여름 오후 햇볕이 그쪽 창으로 강하게 들어 냉방비가 더 들 수 있어요. 차양, 블라인드, 나무 그늘이 도움돼요.`,
      `${w.en}. ${where.en} strong afternoon sun pours through those windows and can push up cooling bills. Awnings, blinds or a shade tree help.`); }
    return say("good",
      `앞이 ${dir(f).ko}, 뒤가 ${dir(b).ko}을 봐요. ${where.ko} 뜨거운 오후 햇볕이 큰 창에 덜 들어 여름이 수월해요.`,
      `The front faces ${dir(f).en} and the back ${dir(b).en}. ${where.en} that keeps the hot afternoon sun off the big windows.`);
  }
  if (cl === "cold") {
    if (south) { const w = side(south); return say("good",
      `${w.ko} 봐요. 겨울이 추운 곳이라 그쪽 창으로 드는 햇볕이 집을 데워 줘요.`,
      `${w.en}. Winters are cold here, so that sun is a lovely free heater.`); }
    return say("know", "남쪽을 보는 큰 창이 없어요. 겨울이 추운 곳이라 난방이 더 들 수 있어요.",
      "No big windows face south, and winters are cold here, so heating may cost a little more.");
  }
  if (south) { const w = side(south), hot = south === west; return say("good",
    `${w.ko} 봐요. 날씨가 온화한 곳이라 그쪽으로 햇살이 고르게 들어요.${hot ? " 여름 오후엔 조금 더울 수 있어요." : ""}`,
    `${w.en}. The weather is mild here, so you get soft, even sun on that side.${hot ? " It can get warm on summer afternoons." : ""}`); }
  if (west) { const w = side(west); return say("know",
    `${w.ko} 봐요. 날씨가 온화해 방향의 영향은 작지만, 그쪽은 여름 오후에 더워질 수 있어요.`,
    `${w.en}. The weather is mild, so facing matters less, but that side can get warm on summer afternoons.`); }
  return say("know", "날씨가 온화해 방향의 영향은 작아요.", "The weather is mild here, so facing matters less.");
}

function usLiving(r) {
  const ul = r.us_living || {};
  const u = (isEn() && ul.en) || ul.ko;
  if (!u) return "";
  const fix = (s) => (isEn() ? String(s || "").replace(/풍수/g, "feng shui") : s);   // the engine's English note says "풍수"
  const KIND = { good: { ko: "좋아요", en: "Nice" }, mixed: { ko: "의견이 갈려요", en: "Mixed feelings" }, know: { ko: "알아 두세요", en: "Good to know" } };
  const sun = sunNote(r), items = sun ? [sun, ...u.items] : u.items;
  const body = items.length
    ? items.map((x) => `<div class="it"><span class="k ${x.kind}">${T(KIND[x.kind])}</span><span>${fix(x.text)}</span></div>`).join("")
    : `<p style="margin:0;font-size:14px">${fix(u.nothing)}</p>`;
  return `<div class="card usl"><h2>${fix(u.title)} <small>${T({ ko: "풍수 별점과 별개", en: "Not part of the feng shui stars" })}</small></h2><p class="usl-note">${fix(u.note)}</p>${body}
    ${u.lot_note ? `<p class="usl-note" style="margin:8px 0 0">${fix(u.lot_note)}</p>` : ""}</div>`;
}

function stars(n) { return "★".repeat(n) + `<i>${"★".repeat(5 - n)}</i>`; }

const autoAsked = new Set();   // live homes: ask for a reading in a new language once per visit, never in a loop

/* 좋은 점 / 아쉬운 점 (Zillow's "What's special" / "Tradeoffs", owner Nov 16). Same fixed rules as
   api/card.py _chips, so it is free, instant and the same every time. */
function prosCons(r) {
  const c = r.score.components, good = [], weak = [];
  const A = c.hyeonmu, B = c.jujak, C = c.enclosure, D = c.jangpung, E = c.deuksu, F = c.jwahyang, G = c.stability;
  const g = (ok, ko, en) => { if (ok) good.push(T({ ko, en })); };
  const w = (ok, ko, en) => { if (ok) weak.push(T({ ko, en })); };
  g(A.score >= 80, "뒤가 든든해요", "Strong hill behind");
  g(B.score >= 80 && B.facts.ansan, "앞에 알맞은 안산이 있어요", "A well-sized hill in front");
  g(E.score >= 80, "물이 감싸 흘러요", "Water curves toward it");
  g(C.score >= 80, "좌우가 감싸 줘요", "Sheltered on both sides");
  g(D.score >= 90, "겨울바람이 막혀요", "Sheltered from winter wind");
  g(F.score >= 85, "겨울 햇빛이 잘 들어요", "Good winter sun");
  g(G.score >= 80, "땅이 평평하고 안정돼요", "Steady, level ground");
  r.sal.slice().sort((a, b) => (b.penalty || 0) - (a.penalty || 0)).forEach((x) => weak.push(salName(x)));
  w(C.facts.weak_side === "cheongryong", "왼쪽이 낮아요", "Left side is low");
  w(C.facts.weak_side === "baekho", "오른쪽이 낮아요", "Right side is low");
  w(A.score < 50, "뒤가 허전해요", "Little support behind");
  w(E.facts.distance_m == null, "가까운 물이 없어요", "No water close by");
  w(D.facts.wind_open, "겨울바람이 들어요", "Open to winter wind");
  w((F.facts.sun_lost_h || 0) >= 2, "겨울 햇빛이 적어요", "Little winter sun");
  w(G.score <= 40, "경사가 있어요", "Sloping ground");
  return { good, weak };
}
function prosConsHtml(r) {
  const { good, weak } = prosCons(r);
  const li = (arr, kind, none) => arr.length ? arr.map((t) => `<li class="${kind}">${t}</li>`).join("") : `<li class="none">${none}</li>`;
  return `<div class="pros">
    <div class="pc-tabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="good">${T({ ko: "좋은 점", en: "What's special" })} <i>${good.length}</i></button>
      <button role="tab" aria-selected="false" data-t="weak">${T({ ko: "아쉬운 점", en: "Could be better" })} <i>${weak.length}</i></button>
    </div>
    <ul class="pc-list" data-t="good">${li(good, "good", T({ ko: "눈에 띄는 장점은 적어요. 아쉬운 점과 보완법을 함께 보세요.", en: "No big standouts. Take a look at what could be better, and the easy fixes." }))}</ul>
    <ul class="pc-list hidden" data-t="weak">${li(weak, "weak", T({ ko: "크게 아쉬운 점은 없어요.", en: "Nothing big to worry about." }))}</ul>
    <p class="pc-note">${T({ ko: "아쉬운 점에는 집 안에서 할 수 있는 보완법이 있어요.", en: "Each one comes with easy things to try at home." })}</p>
  </div>`;
}
// Every titled card on the result page folds by its title; one button opens or closes them all. Open by default.
function bindFolds() {
  const root = $("report"), btn = $("fold-all");
  if (!root || !btn) return;
  const cards = [...root.querySelectorAll(":scope > .card")].filter((c) => c.tagName === "DETAILS" || c.querySelector(":scope > h2"));
  cards.forEach((c) => {
    if (c.tagName === "DETAILS") return;
    c.classList.add("foldable");
    const h = c.querySelector(":scope > h2");
    h.setAttribute("role", "button"); h.setAttribute("tabindex", "0"); h.setAttribute("aria-expanded", "true");
    const flip = () => { c.classList.toggle("closed"); h.setAttribute("aria-expanded", String(!c.classList.contains("closed"))); };
    h.addEventListener("click", flip);
    h.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  });
  btn.addEventListener("click", () => {
    const open = btn.getAttribute("aria-expanded") !== "true";
    cards.forEach((c) => {
      if (c.tagName === "DETAILS") c.open = open;
      else { c.classList.toggle("closed", !open); c.querySelector(":scope > h2").setAttribute("aria-expanded", String(open)); }
    });
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? T({ ko: "모두 접기", en: "Close all" }) : T({ ko: "모두 펼치기", en: "Open all" });
  });
}

// where the door direction came from: guessed from the street, or set by the person
function doorLine(r, ix) {
  const src = r.site.facing_source;
  const how = src === "compass" ? { ko: "나침반으로 잼", en: "measured with your camera" }
    : src === "manual" ? { ko: "직접 고침", en: "set by you" } : { ko: "길 방향으로 추정", en: "our best guess from the street" };
  return isEn() ? `The door faces ${DIR8.en[ix]} (${how.en})` : `현관이 ${DIR8.ko[ix]}쪽을 봐요 (${T(how)})`;
}

/* ---------- fix the door direction: 8-way dial, or the phone's compass ---------- */
const DIR_SHORT = { ko: DIR8.ko, en: ["N", "NE", "E", "SE", "S", "SW", "W", "NW"] };
let compassStop = null;
function doorSheet(id, busy) {

             en: "Picture stepping out your front door: the way you're facing is the front of your home in feng shui." })}</p>
    ${canCompass ? `<div class="compass" id="compass">
      <button class="btn accent" type="button" id="compass-go">📷 ${T({ ko: "카메라로 방향 재기", en: "Use my camera" })}</button>
      <p class="small">${T({ ko: "집에 있을 때만 쓸 수 있어요. 현관문에 서서 사진 찍듯이 폰을 세워 문 밖을 비춰 주세요.",
                            en: "Works when you're at home. Stand in your front doorway and point the camera outside, like you're taking a photo." })}</p>
    </div>` : ""}
    <p class="small" style="margin-top:14px">${T({ ko: canCompass ? "또는 직접 골라 주세요" : "방향을 골라 주세요", en: canCompass ? "Or pick it yourself" : "Pick the direction" })}</p>
    <div class="dirs">${cell(7)}${cell(0)}${cell(1)}${cell(6)}<span class="dir-home" aria-hidden="true">🏠</span>${cell(2)}${cell(5)}${cell(4)}${cell(3)}</div>

}

async function applyDoor(id, deg, source) {
  if (compassStop) compassStop();
  const ix = Math.round((((deg % 360) + 360) % 360) / 45) % 8;

// the way the back camera looks, clockwise from north. iPhone: webkitCompassHeading (tilt-compensated);
// Android: from an absolute alpha/beta/gamma (the W3C orientation spec's compass-heading formula).
function cameraHeading(e) {
  if (e.webkitCompassHeading != null && e.webkitCompassHeading >= 0) return e.webkitCompassHeading;
  if (!e.absolute || e.alpha == null || e.beta == null || e.gamma == null) return null;
  const r = Math.PI / 180, x = e.beta * r, y = e.gamma * r, z = e.alpha * r;
  const vx = -Math.cos(z) * Math.sin(y) - Math.sin(z) * Math.sin(x) * Math.cos(y);
  const vy = -Math.sin(z) * Math.sin(y) + Math.cos(z) * Math.sin(x) * Math.cos(y);
  let h = Math.atan(vx / vy);
  if (vy < 0) h += Math.PI; else if (vx < 0) h += 2 * Math.PI;
  return h / r;
}

// full-screen camera view with the direction written over it. Nothing from the camera leaves the phone.
async function startCompass(id) {
  try {
    if (typeof DeviceOrientationEvent.requestPermission === "function"
        && (await DeviceOrientationEvent.requestPermission()) !== "granted") throw new Error("denied");
  } catch (_) {
    $("compass").innerHTML = `<p class="small err">${T({ ko: "방향 센서를 쓰도록 허락되지 않았어요. 아래에서 직접 골라 주세요.", en: "No problem. Motion access is off, so just pick the direction below." })}</p>`;
    return;
  }
  const cam = document.createElement("div");
  cam.id = "cam";
  cam.innerHTML = `<video id="cam-video" autoplay playsinline muted></video>
    <div class="cam-top"><div class="cam-tape" id="cam-tape"></div><div class="cam-mark"></div>
      <p>${T({ ko: "현관문에 서서 문 밖을 비춰 주세요", en: "Stand in your doorway and point the camera outside" })}</p></div>
    <div class="cam-cross" aria-hidden="true"></div>
    <div class="cam-bottom">
      <p class="cam-dir" id="cam-dir">${T({ ko: "방향을 읽는 중…", en: "Reading the direction…" })}</p>
      <button class="btn accent" type="button" id="cam-ok" disabled>${T({ ko: "이 방향으로", en: "Use this direction" })}</button>
      <button class="cam-x" type="button" id="cam-x">${T({ ko: "취소", en: "Cancel" })}</button>
    </div>`;
  document.body.appendChild(cam);
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    $("cam-video").srcObject = stream;
  } catch (_) { cam.classList.add("no-video"); }       // no camera: the direction still works on a dark screen
  // smooth the jitter: average unit vectors
  let sx = 0, sy = 0, heading = null;
  const tape = $("cam-tape"), PX = 4;                 // 4px per degree; the strip shows about ±45°
  const marks = [];
  for (let d = 0; d < 360; d += 15) marks.push(d);
  const on = (e) => {
    const h = cameraHeading(e);
    if (h == null || isNaN(h)) return;
    const r = h * Math.PI / 180;
    sx = heading == null ? Math.sin(r) : sx * 0.8 + Math.sin(r) * 0.2;
    sy = heading == null ? Math.cos(r) : sy * 0.8 + Math.cos(r) * 0.2;
    heading = ((Math.atan2(sx, sy) * 180 / Math.PI) + 360) % 360;
    const ix = Math.round(heading / 45) % 8;
    $("cam-dir").textContent = `${isEn() ? DIR8.en[ix] : DIR8.ko[ix] + "쪽"} · ${Math.round(heading)}°`;
    tape.innerHTML = marks.map((d) => {
      const off = ((d - heading + 540) % 360) - 180;
      if (Math.abs(off) > 60) return "";
      const big = d % 45 === 0;
      const lab = big ? (isEn() ? DIR_SHORT.en[d / 45] : DIR_SHORT.ko[d / 45]) : "";
      return `<span class="${big ? "big" : ""}" style="left:calc(50% + ${off * PX}px)">${lab}</span>`;
    }).join("");
    $("cam-ok").disabled = false;
  };
  const ev = "ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation";
  window.addEventListener(ev, on);
  compassStop = () => {
    window.removeEventListener(ev, on);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    cam.remove();
    compassStop = null;
  };
  setTimeout(() => {
    if (heading == null && $("cam-dir")) $("cam-dir").textContent =
      T({ ko: "이 폰에서는 방향을 읽지 못했어요. 취소하고 직접 골라 주세요.", en: "Your phone didn't share a direction. Tap Cancel and pick one yourself." });
  }, 3000);
  $("cam-x").addEventListener("click", () => compassStop && compassStop());
  $("cam-ok").addEventListener("click", () => {
    if (heading == null) return;
    const h = heading;
    compassStop();
    applyDoor(id, h, "compass");
  });
}

      </div>
      <div class="says">${CH.toad(64, { pose: s.stars >= 4 ? "yay" : "hello", cls: "pop" })}<div class="bubble">${s.level_land ? levelLine(r) : w.headline}</div></div>
      ${s.level_land ? levelChips(r) : ""}
    </div>

    <nav class="jump" aria-label="${T({ ko: "바로 가기", en: "Jump to" })}">
      <a href="#sec-sum">${T({ ko: "요약", en: "Summary" })}</a><a href="#sec-land">${T({ ko: "땅", en: "Land" })}</a><a href="#sec-reading">${T({ ko: "해설", en: "Reading" })}</a><a href="#sec-ask">${T({ ko: "묻기", en: "Ask" })}</a>
    </nav>
    <div class="fold-all"><button type="button" id="fold-all" aria-expanded="true">${T({ ko: "모두 접기", en: "Close all" })}</button></div>

    ${cardsSection(allCards)}

    ${window.GILJI && GILJI.api ? `<button class="fab" id="fab" aria-label="${T({ ko: "터주에게 묻기", en: "Ask Teoju" })}">${CH.toad(44, { pose: "hello" })}<span>${T({ ko: "묻기", en: "Ask" })}</span></button>
    <div class="chat-sheet" id="chat-sheet" aria-hidden="true">
      <div class="cs-backdrop" data-close></div>
      <div class="cs-panel" role="dialog" aria-label="${T({ ko: "터주에게 물어보기", en: "Ask Teoju" })}">
        <div class="cs-grab"></div><button class="cs-x" data-close aria-label="${T({ ko: "닫기", en: "Close" })}">✕</button>
        ${GILJI.chatCard(id)}
      </div></div>` : ""}

    <div class="card photo-up"><div class="ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></div>
      <p>${T({ ko: "<b>현장 사진 다섯 장</b>을 더하면 현관 방향과 길·고가 같은 살펴볼 점을 직접 확인해 더 정확하게 읽어 드려요. (다음 단계)",
        en: "Coming soon: add <b>five photos</b> of the place, and we'll double-check the door and anything worth a look, like nearby roads, for an even better reading." })}</p></div>

    <div class="actions">
      <button class="btn ghost" id="to-compare">${T({ ko: "다른 집과 비교", en: "Compare homes" })}</button>
      <button class="btn ghost" id="to-home">${T({ ko: "다른 집 보기", en: "Look up another home" })}</button>
    </div>
    <p class="disclaimer">${T(DISCLAIMER)}<br>${T({ ko: "데이터", en: "Data" })}: Copernicus GLO-30, © OpenStreetMap contributors</p>
    ${paid || BETA_FREE ? "" : `<div class="dock"><button class="btn accent" id="dock-buy">${T({ ko: "이 집 전체 해설 열기", en: "Open the full reading" })}<small>${T({ ko: "$1 · 베타 동안 무료", en: "$1 · free during the beta" })}</small></button></div>`}`;
  $("report").classList.toggle("has-dock", !paid && !BETA_FREE);

  // timers, not requestAnimationFrame: rAF stalls in background tabs and the bars would stay empty
  setTimeout(() => {
    document.querySelectorAll("#report .dial circle[data-off]").forEach((c) => (c.style.strokeDashoffset = c.dataset.off));
    document.querySelectorAll("#report .dial .num b").forEach(countUp);
  }, 60);
  $("report").querySelectorAll("details").forEach((d) => d.addEventListener("toggle", (e) => {
    if (e.target.open) setTimeout(() => e.target.querySelectorAll(".fill").forEach((f) => (f.style.width = f.dataset.w)), 30);
  }));
  if ($("buy")) $("buy").addEventListener("click", () => fakeDoor(id));
  if ($("dock-buy")) $("dock-buy").addEventListener("click", () => fakeDoor(id));
  const openChat = () => {
    const sh = $("chat-sheet"); if (!sh) return;
    sh.classList.add("open"); sh.setAttribute("aria-hidden", "false"); document.body.classList.add("noscroll");
    setTimeout(() => { const i = $("chat-q"); if (i && !matchMedia("(pointer: coarse)").matches) i.focus(); }, 350);
  };
  const closeChat = () => { const sh = $("chat-sheet"); if (!sh) return; sh.classList.remove("open"); sh.setAttribute("aria-hidden", "true"); document.body.classList.remove("noscroll"); };
  ["fab", "ask-open"].forEach((k) => { if ($(k)) $(k).addEventListener("click", openChat); });
  if ($("chat-sheet")) $("chat-sheet").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeChat(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeChat(); }, { once: true });
  $("report").querySelectorAll(".pc-tabs button").forEach((b) => b.addEventListener("click", () => {
    $("report").querySelectorAll(".pc-tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
    $("report").querySelectorAll(".pc-list").forEach((l) => l.classList.toggle("hidden", l.dataset.t !== b.dataset.t));
  }));
  $("report").querySelectorAll(".jump a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    if (a.getAttribute("href") === "#sec-ask") { openChat(); return; }
    const t = $(a.getAttribute("href").slice(1)); if (t) t.scrollIntoView({ behavior: "smooth" });
  }));
  $("heart").addEventListener("click", () => {
    const on = !favs().includes(id);
    store.set("favs", on ? [id, ...favs()] : favs().filter((x) => x !== id));
    const b = $("heart"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    b.querySelector("path").parentNode.setAttribute("fill", on ? "currentColor" : "none");
    b.classList.remove("beat"); void b.offsetWidth; b.classList.add("beat");
    renderLists();
    toast(on ? T({ ko: "찜한 집에 담았어요.", en: "Saved." }) : T({ ko: "찜을 취소했어요.", en: "Removed from Saved." }));
  });
  $("own-home").addEventListener("click", () => {
    const on = store.get("saved") !== id; store.set("saved", on ? id : null);
    const b = $("own-home"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    b.textContent = "🏠 " + (on ? T({ ko: "우리 집이에요", en: "This is my home" }) : T({ ko: "우리 집으로 정하기", en: "Make this my home" }));
    rerenderTip(id); renderSavedTip();
    toast(on ? T({ ko: "우리 집으로 정했어요. 흥이가 매일 박씨를 물어 와요.", en: "This is now your home. Heungi will bring you a tip every day." })
             : T({ ko: "우리 집에서 뺐어요.", en: "Okay, it's no longer set as your home." }));
  });
  $("share").addEventListener("click", async () => {
    const url = location.origin + location.pathname + (ORDER.includes(id) ? "#p=" + id : "");
    const data = { title: T({ ko: "박씨 · 우리 집의 기운", en: "Bakseed · what a home's land says" }), text: `${shortName(id)} — ★ ${s.stars}/5 · ${gradeName(s.grade)}`, url };
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(url); toast(T({ ko: "링크를 복사했어요.", en: "Link copied." })); } catch (e) { toast(url); }
  });
  if (window.GILJI) GILJI.bindChat(id);
  bindCards(id, allCards, r);
  bindFolds();
  if ($("fix-door")) $("fix-door").addEventListener("click", () => doorSheet(id));
  bindTip(id);
  setTimeout(() => drawMap(id), 0);   // after show("report") makes the container visible
  if ($("to-compare")) $("to-compare").addEventListener("click", () => openCompare(id));
  $("to-home").addEventListener("click", () => show("home"));
}

function bindTip(id) {
  const save = $("save-home");
  if (save) save.addEventListener("click", () => {
    store.set("saved", id); rerenderTip(id); renderSavedTip();
    const b = $("own-home"); if (b) { b.classList.add("on"); b.setAttribute("aria-pressed", "true"); b.textContent = "🏠 " + T({ ko: "우리 집이에요", en: "This is my home" }); }
  });
  const next = $("tip-next");
  if (next) next.addEventListener("click", () => { dayOffset++; rerenderTip(id); });
}
function rerenderTip(id) {
  const old = $("report").querySelector(".tip");
  const holder = document.createElement("div");
  holder.innerHTML = tipCard(id, { saveBtn: true });
  old.replaceWith(holder.firstElementChild);
  bindTip(id);
}

/* ---------- fake-door paywall ---------- */
function fakeDoor(id) {
  const n = store.get("taps", 0) + 1;
  store.set("taps", n);
  const open = () => { unlocked.add(id); store.set("unlocked", [...unlocked]); renderReport(id); };
  if (window.GILJI && GILJI.isLive(id) && !writer()[id]) { GILJI.unlock(id, open); return; }
  const freeSheet = () => {
    sheet(`<h3>${T({ ko: "베타 동안은 무료예요", en: "Free during the beta" })}</h3>
      <p>${T({ ko: "정식으로 열면 한 집에 $1 정도를 생각하고 있어요. 열어 보신 횟수를 이 브라우저에만 기록해요.",
        en: "After launch we're thinking of about $1 per home. We count how many times you open it, in this browser only." })}</p>
      <p class="count">${T({ ko: "이 브라우저에서 연 횟수", en: "Times opened in this browser" })}: ${n}</p>
      <button class="btn accent block" id="ok">${T({ ko: "전체 해설 열기", en: "Open the full reading" })}</button>`, freeSheet);
    $("ok").addEventListener("click", () => { closeSheet(); open(); });
  };
  freeSheet();
}

/* ---------- compare ---------- */
let picked = new Set();
function openCompare(fromId) {
  picked = new Set([fromId, ...ORDER.filter((k) => k !== fromId)].slice(0, 3));
  renderCompare(); show("compare");
}
function renderCompare() {
  const ids = ORDER.filter((k) => picked.has(k));
  const best = Math.max(...ids.map((k) => R[k].score.stars));   // one rating for every home (v0.8)
  const row = (label, f) => `<tr><th>${label}</th>${ids.map((k) => `<td>${f(R[k], k)}</td>`).join("")}</tr>`;
  $("compare").innerHTML = `
    <div class="card"><h2>${T({ ko: "집 비교", en: "Compare homes" })} <small>${T({ ko: "최대 세 곳", en: "Up to three" })}</small></h2>
      <div class="pick">${ORDER.map((k) => `<button aria-pressed="${picked.has(k)}" data-id="${k}">${shortName(k)}</button>`).join("")}</div>
      ${ids.length < 2 ? `<p class="none" style="margin-top:12px">${T({ ko: "두 곳 이상 골라 주세요.", en: "Pick two or more." })}</p>` : `
      <div class="cmp"><table>
        <thead><tr><th></th>${ids.map((k) => `<th>${shortName(k)}</th>`).join("")}</tr></thead>
        <tbody>
          ${row(T({ ko: "별점", en: "Stars" }), (r) => `<span class="big ${r.score.stars === best ? "best" : ""}">★ ${r.score.stars}<small style="font-size:13px;color:var(--ink-3)">/5</small></span>${r.score.stars === best ? `<span class="tag">${T({ ko: "가장 높아요", en: "Highest" })}</span>` : ""}`)}
          ${row(T({ ko: "등급", en: "Grade" }), (r) => `<b class="serif">${gradeName(r.score.grade)}</b>`)}
          ${Object.keys(GIUN).map((g) => row(T(GIUN[g]), (r) => `<span class="stars" style="letter-spacing:0">${stars(r.giun.find((x) => x.key === g).stars)}</span>`)).join("")}
          ${row(T({ ko: "물길", en: "Water" }), (r) => `${riverName(r.score.components.deuksu.facts)}<br><span style="color:var(--ink-3);font-size:12px">${bend(r.score.components.deuksu.facts.bend)}</span>`)}
          ${row(T({ ko: "살펴볼 점", en: "Worth a look" }), (r) => r.sal.length ? r.sal.map(salName).join("<br>") : T({ ko: "없음", en: "None" }))}
          ${row(T({ ko: "보완법", en: "Fixes" }), (r) => T({ ko: `${TIPS.siteTips(r).length}가지`, en: `${TIPS.siteTips(r).length}` }))}
        </tbody></table></div>`}
    </div>
    <p class="disclaimer">${T({ ko: "별점은 참고용이에요. 어느 집이 좋을지는 직접 판단해 주세요.", en: "Stars are just one way to look at it. You know what feels like home." })}<br>${T(DISCLAIMER)}</p>
    <div class="actions"><button class="btn ghost" id="cmp-home">${T({ ko: "처음으로", en: "Home" })}</button><button class="btn ghost" id="cmp-back">${T({ ko: "보고서로", en: "Back to the report" })}</button></div>`;
  $("compare").querySelector(".pick").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.id;
    if (picked.has(k)) picked.delete(k); else if (picked.size < 3) picked.add(k);
    renderCompare();
  });
  $("cmp-home").addEventListener("click", () => show("home"));
  $("cmp-back").addEventListener("click", () => show("report"));
}

/* ---------- about + sheet ---------- */
const ABOUT = {
  ko: `<h3 style="margin-top:0">형기론 한 가지로 읽어요</h3>
    <p>산과 물, 땅의 모양으로 터를 읽는 형기론(形氣論)만 써요. 나경과 공식으로 보는 이기론은 다루지 않아요.</p>
    <h3>같은 집은 같은 별점</h3>
    <p>모든 집을 같은 별 다섯 개로 매겨요. 땅이 평평한 집도 같은 별점이에요. 별점은 정해진 규칙이 매기고, 해설은 그 결과를 풀어 쓸 뿐 별점을 바꾸거나 새 판단을 더하지 않아요.</p>
    <h3>무엇을 보나요</h3>
    <p>반경 3.5km의 지형으로 현무·주작·청룡·백호와 바람길을, 물길의 굽음으로 득수를, 주변 도로·고가·송전선·묘지로 살펴볼 점을 찾아요.</p>
    <h3>터주와 흥이</h3>
    <p>두꺼비 터주는 집터를 지키는 터줏대감이에요. 산과 물을 읽고 이 집의 이야기를 들려줘요. 제비 흥이는 흥부에게 박씨를 물어다 준 제비처럼, 매일 이 집에 맞는 박씨(오늘의 보완법) 하나를 물어 와요.</p>
    <h3>보완법</h3>
    <p>터의 모자란 곳을 나무, 가구, 색, 배치로 채우는 방법이에요. 풍수에서는 비보(裨補)라고 불러요.</p>
    <h3>데이터</h3>`,
  en: `<h3 style="margin-top:0">One school: the landform school</h3>
    <p>We read a site only by the shape of its hills, water and land, the landform school of feng shui (hyeonggiron, 形氣論). We don't use the compass-and-formula school.</p>
    <h3>Same home, same stars</h3>
    <p>Every home is rated on the same five stars, homes on level land too. A fixed set of rules gives the stars. The written reading only explains that result. It never changes the rating or adds new judgments.</p>
    <h3>What we look at</h3>
    <p>From the land within 3.5 km we read the four sides (back, front, left and right) and the wind. From how the water bends we read the water. And we look for things to watch nearby, like roads, overpasses, power lines and cemeteries.</p>
    <h3>Teoju and Heungi</h3>
    <p>Teoju the toad is the guardian spirit of the home's land. He reads the hills and water and tells you this home's story. Heungi the swallow is like the swallow in the Korean folk tale who brought Heungbu a gourd seed: every day she brings one seed, today's fix, made for this home.</p>
    <h3>Fixes</h3>
    <p>Ways to make up for what the land lacks, with plants, furniture, color and layout. Feng shui calls this bibo (裨補).</p>
    <h3>Data</h3>`,
};
function openAbout() {
  sheet(`<div class="about">${ABOUT[window.GILJI_LANG] || ABOUT.ko}
    <p>Copernicus GLO-30 (© DLR e.V., © Airbus Defence and Space GmbH, provided under COPERNICUS by the EU and ESA) · © OpenStreetMap contributors (ODbL)</p>
    <p style="margin-top:14px;font-size:12px;color:var(--ink-3)">${T(DISCLAIMER)}</p>
    <button class="btn block" id="ok" style="margin-top:12px">${T({ ko: "닫기", en: "Close" })}</button></div>`, openAbout);
  $("ok").addEventListener("click", closeSheet);
}
window.giljiShow = (id) => show(id);
window.giljiOpen = (id) => { dayOffset = 0; renderReport(id); show("report"); };
window.giljiSheet = (html, redraw) => sheet(html, redraw);
window.giljiCloseSheet = () => closeSheet();
window.giljiHint = (text, err) => setHint(text, err);
// redraw: how to draw the open sheet again in the other language (keeps its state, never re-sends)
let sheetRedraw = null;
function sheet(html, redraw) {
  sheetRedraw = redraw || null;
  const keepScroll = !$("modal").classList.contains("hidden") && redraw ? $("sheet").scrollTop : 0;
  $("sheet").innerHTML = html; $("modal").classList.remove("hidden");
  $("sheet").scrollTop = keepScroll;
}
function closeSheet() { $("modal").classList.add("hidden"); sheetRedraw = null; if (compassStop) compassStop(); }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- language switch: redraw what is on screen, in place ---------- */
I18N.onLang(() => {
  applyStatic();
  renderHome();
  renderLists(); tabbarLabels();
  if (screen === "mine") renderMine();
  if (screen === "reading" && current && SHORT[current]) $("reading-addr").textContent = shortName(current);
  if (screen === "compare") renderCompare();
  if (screen === "report" && current && R[current]) {
    // keep the scroll spot and any folded sections the reader had opened
    const y = window.scrollY;
    const open = [...$("report").querySelectorAll("details")].map((d) => d.open);
    const typed = $("chat-q") ? $("chat-q").value : "";
    renderReport(current);
    $("report").querySelectorAll("details").forEach((d, i) => { if (open[i]) d.open = true; });
    if ($("chat-q")) $("chat-q").value = typed;
    window.scrollTo(0, y);
  }
  if (sheetRedraw && !$("modal").classList.contains("hidden")) sheetRedraw();
});

applyStatic();
renderSavedTip(); renderLists(); tabbarLabels();
</script>
</body>
</html>
