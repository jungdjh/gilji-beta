<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길지 Gilji · 베타</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --paper: #f8f4ee;
  --card: #fffdf9;
  --ink: #2e2925;
  --ink-2: #6b625a;
  --ink-3: #a0968b;
  --line: #ebe3d8;
  --accent: #b8684e;
  --accent-soft: #f6e6df;
  --sage: #6f8f74;
  --sage-soft: #e9f0e7;
  --wood: #6f8f74;
  --fire: #c9705a;
  --earth: #c9a15a;
  --metal: #a3a7ad;
  --water: #5b6f8f;
  --shadow: 0 1px 2px rgba(46,41,37,.04), 0 8px 24px rgba(46,41,37,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1714; --card: #23201c; --ink: #f1ebe3; --ink-2: #c4bab0; --ink-3: #8f857b;
    --line: #38322c; --accent: #d98c72; --accent-soft: #3b2a24; --sage: #93b398; --sage-soft: #26302a;
    --wood: #93b398; --fire: #e08f79; --earth: #dcbb7a; --metal: #b9bdc3; --water: #8ea3c4; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1714; --card: #23201c; --ink: #f1ebe3; --ink-2: #c4bab0; --ink-3: #8f857b;
  --line: #38322c; --accent: #d98c72; --accent-soft: #3b2a24; --sage: #93b398; --sage-soft: #26302a;
  --wood: #93b398; --fire: #e08f79; --earth: #dcbb7a; --metal: #b9bdc3; --water: #8ea3c4; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.7 "Noto Sans KR", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: "Gowun Batang", serif; }
.wrap { max-width: 460px; margin: 0 auto; padding: 0 16px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.mark { width: 34px; height: 34px; flex: none; }
.brand b { font: 700 18px "Gowun Batang", serif; }
.demo-tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }

/* home */
.hero { padding: 36px 0 20px; text-align: center; }
.hero h1 { font: 700 28px/1.4 "Gowun Batang", serif; margin: 0 0 10px; letter-spacing: -.3px; }
.hero p { color: var(--ink-2); margin: 0; font-size: 14px; }
.search { display: flex; gap: 8px; margin-top: 24px; }
.search input {
  flex: 1; min-width: 0; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn {
  border: 0; border-radius: 14px; padding: 14px 18px; background: var(--ink); color: var(--paper);
  font-weight: 700; white-space: nowrap;
}
.btn.accent { background: var(--accent); color: #fffaf6; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 99px; }
.btn.block { width: 100%; }
.hint { font-size: 13px; color: var(--ink-3); margin: 10px 4px 0; min-height: 20px; }
.hint.err { color: var(--accent); }
.section-label { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; margin: 28px 4px 10px; }
.sample { display: grid; gap: 8px; }
.sample button {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
}
.sample small { display: block; color: var(--ink-3); font-size: 12px; }
.sample .arrow { color: var(--ink-3); }
.ladder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ladder div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; text-align: center; }
.ladder b { display: block; font: 700 15px "Gowun Batang", serif; }
.ladder span { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.ladder em { display: block; font-style: normal; font-size: 12px; color: var(--accent); margin-top: 4px; font-weight: 700; }

/* reading */
.reading { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 18px; }
.bob { animation: bob 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bob { 50% { transform: translateY(-6px) scaleY(1.03); } }
.flap { animation: flap 1.6s ease-in-out infinite; }
@keyframes flap { 50% { transform: translateY(-4px) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { .bob, .flap { animation: none; } }
.duo { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin-bottom: 12px; }
.duo .flap { margin-bottom: 46px; }
.says { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: end; margin-top: 16px; }
.bubble { position: relative; background: var(--paper); border-radius: 16px 16px 16px 4px; padding: 12px 14px; font: 700 16px/1.55 "Gowun Batang", serif; }
.tip .when { align-items: center; }
.tip .who { display: flex; align-items: center; gap: 6px; }
.tip .who svg { background: #fbf3e4; border-radius: 12px; padding: 3px 4px; flex: none; }
.reading ol { list-style: none; padding: 0; margin: 0; color: var(--ink-3); font-size: 14px; }
.reading li { transition: color .3s; }
.reading li.on { color: var(--ink); }
.reading li.done { color: var(--sage); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; margin-top: 14px; box-shadow: var(--shadow); }
.card h2 { font: 700 18px "Gowun Batang", serif; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card h2 small { font: 400 12px "Noto Sans KR", sans-serif; color: var(--ink-3); }
.addr { font-size: 13px; color: var(--ink-2); }
.top { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: center; margin-top: 10px; }
.dial { position: relative; width: 124px; height: 124px; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .num b { font: 700 38px/1 "Gowun Batang", serif; }
.dial .num span { font-size: 12px; color: var(--ink-3); }
.dial.level .num b { font-size: 30px; }
.level-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.level-chips .chip { background: var(--paper); color: var(--ink-2); font-size: 12px; }
.level-chips .chip.warn { color: var(--accent); }
.grade { display: inline-block; font: 700 15px "Gowun Batang", serif; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 14px; }
.headline { font: 700 17px/1.55 "Gowun Batang", serif; margin: 10px 0 0; }
.meta { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* today's tip */
.tip { background: var(--sage-soft); border-color: transparent; }
.tip .when { font-size: 12px; color: var(--sage); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.tip h3 { font: 700 19px/1.45 "Gowun Batang", serif; margin: 8px 0 6px; }
.tip p { margin: 0; font-size: 14px; color: var(--ink-2); }
/* "US living" card: a different look from the 풍수 cards, so it never reads as part of the score */
.usl { border: 1px dashed var(--line); background: transparent; }
.chat .msgs { display: grid; gap: 8px; }
.chat .q { justify-self: end; max-width: 85%; background: var(--accent-soft); color: var(--ink); padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.6; }
.chat .a { max-width: 92%; background: var(--paper); padding: 10px 13px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 1.75; }
.chat .a.wait { color: var(--ink-3); }
.chat .a.err { color: var(--accent); }
.chat .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chat .facts span { font-size: 12px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.chat .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chat .sugg .btn { text-align: left; }
.chat .chat-note { font-size: 12px; color: var(--ink-3); margin: 8px 2px 0; }
.usl .usl-note { font-size: 13px; color: var(--ink-3); margin: -4px 0 12px; }
.usl .it { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.usl .k { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; margin-top: 3px; }
.usl .k.good { background: var(--card); color: var(--sage); }
.usl .k.mixed { background: var(--card); color: var(--ink-2); }
.usl .k.know { background: var(--card); color: var(--accent); }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--card); color: var(--sage); }
.tip .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.tip .btn.ghost { background: var(--card); border-color: transparent; }

/* map */
.map .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: 0; }
.leaf { height: 380px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); z-index: 0; }
.leaf .sect-label span { display: inline-block; transform: translate(-50%, -50%); background: rgba(255,253,249,.92); color: #2e2925; border: 1.5px solid; border-radius: 10px; padding: 2px 8px; font: 12px/1.35 "Noto Sans KR", sans-serif; text-align: center; white-space: nowrap; }
.leaf .sect-label em { font-style: normal; font-size: 11px; color: #6b625a; }
.leaf .peak { white-space: nowrap; }
.leaf .peak i { display: block; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid; transform: translate(-50%, -100%); filter: drop-shadow(0 0 1px #fff); }
.leaf .peak span { display: block; transform: translate(-50%, -6px); font: 700 11px "Gowun Batang", serif; color: #2e2925; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.leaf .face-arrow span { display: block; color: #b8684e; font-size: 16px; line-height: 18px; text-align: center; }
.leaf .home-pin svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
.leaf .sal-mark { background: #c0392b; color: #fff; border-radius: 50%; font: 700 13px/20px sans-serif; text-align: center; box-shadow: 0 0 0 2px #fff; }
.watch-note { color: #c0392b; }
.sasinsa .side { font-size: 12px; font-weight: 700; color: var(--accent); margin-right: 4px; }
.water-note { font-size: 13px; color: var(--ink-2); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.sasinsa { display: grid; gap: 6px; margin-top: 12px; font-size: 14px; }
.sasinsa div { display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.sasinsa b { font-family: "Gowun Batang", serif; }

/* detail components (folded) */
details.card > summary { list-style: none; cursor: pointer; font: 700 16px "Gowun Batang", serif; display: flex; justify-content: space-between; align-items: center; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary span { font: 400 12px "Noto Sans KR", sans-serif; color: var(--ink-3); }
details.card[open] > summary { margin-bottom: 14px; }
.comp { display: grid; gap: 12px; }
.comp .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.comp .name b { font-family: "Gowun Batang", serif; }
.comp .name span { color: var(--ink-3); font-size: 12px; margin-left: 4px; }
.comp .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.comp .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.comp .fill { height: 100%; background: var(--sage); border-radius: 3px; transition: width .8s ease; }
.comp .fill.low { background: var(--accent); }
.comp .fact { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }

/* paywall */
.locked { position: relative; max-height: 440px; overflow: hidden; border-radius: 20px; }
.locked .blur { filter: blur(6px); pointer-events: none; user-select: none; opacity: .7; }
.pay {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 20px;
  background: linear-gradient(180deg, transparent 10%, var(--paper) 60%);
}
.pay h3 { font: 700 19px "Gowun Batang", serif; margin: 0; }
.pay p { margin: 0; font-size: 13px; color: var(--ink-2); }
.pay .price { font: 700 26px "Gowun Batang", serif; color: var(--accent); }

.summary p { margin: 0 0 8px; font-family: "Gowun Batang", serif; font-size: 16px; line-height: 1.85; }
.tips { display: grid; gap: 10px; }
.tips .t { border-radius: 14px; background: var(--paper); padding: 12px 14px; }
.tips .t h4 { margin: 0 0 4px; font: 700 15px "Gowun Batang", serif; display: flex; gap: 8px; align-items: center; }
.tips .t p { margin: 0; font-size: 13px; color: var(--ink-2); }
.watch { display: grid; gap: 10px; margin-bottom: 14px; }
.watch .w { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.watch .w h4 { margin: 0 0 4px; font: 700 15px "Gowun Batang", serif; display: flex; justify-content: space-between; align-items: baseline; }
.watch .w h4 small { font: 400 12px "Noto Sans KR", sans-serif; color: var(--ink-3); }
.watch .w p { margin: 0; font-size: 13px; color: var(--ink-2); }
.watch .w .fix { margin-top: 8px; font-size: 13px; background: var(--sage-soft); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.watch .w .fix b { color: var(--sage); }
.giun { display: grid; gap: 12px; }
.giun .g { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.giun .g b { font-family: "Gowun Batang", serif; }
.stars { color: var(--accent); letter-spacing: 2px; font-size: 14px; }
.stars i { color: var(--line); font-style: normal; }
.giun .g p { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink-2); }
.oh { display: grid; gap: 7px; }
.oh .r { display: grid; grid-template-columns: 54px 1fr 38px; gap: 8px; align-items: center; font-size: 13px; }
.oh .t { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.oh .t div { height: 100%; border-radius: 5px; }
.oh .pct { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.oh-note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.none { font-size: 14px; color: var(--ink-2); margin: 0; }
.photo-up { display: flex; gap: 12px; align-items: center; }
.photo-up .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; background: var(--paper); display: grid; place-items: center; color: var(--ink-2); }
.photo-up p { margin: 0; font-size: 13px; color: var(--ink-2); }
.disclaimer { font-size: 12px; color: var(--ink-3); text-align: center; margin: 22px 8px 0; line-height: 1.6; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

/* compare */
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.pick button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cmp table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; margin-top: 12px; }
.cmp th, .cmp td { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
.cmp th:first-child, .cmp td:first-child { text-align: left; color: var(--ink-3); width: 72px; font-weight: 400; }
.cmp thead th { font: 700 13px/1.35 "Gowun Batang", serif; }
.cmp .big { font: 700 22px "Gowun Batang", serif; }
.cmp .best { color: var(--accent); }
.cmp .tag { font-size: 11px; color: var(--accent); display: block; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(30,26,22,.45); display: grid; place-items: end center; padding: 16px; z-index: 10; }
.sheet { width: 100%; max-width: 440px; background: var(--card); border-radius: 22px; padding: 22px 20px; max-height: 85vh; overflow: auto; }
.sheet h3 { font: 700 19px "Gowun Batang", serif; margin: 0 0 8px; }
.sheet p { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
.sheet .count { font-size: 12px; color: var(--ink-3); }
.about { font-size: 14px; color: var(--ink-2); }
.about h3 { font-size: 16px; color: var(--ink); margin: 16px 0 4px; }
.about p { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button class="brand" id="go-home" aria-label="처음으로">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="10" fill="var(--accent)"/>
        <path d="M5 18 Q17 6 29 18 Q17 28 5 18 Z" fill="none" stroke="#fffaf6" stroke-width="2"/>
        <path d="M10 20 L14 15 L17 18 L20 13 L24 20" fill="none" stroke="#fffaf6" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <b>길지</b>
    </button>
    <span class="demo-tag">베타 · 초대 전용</span>
  </div>

  <!-- S1 Home -->
  <section id="home">
    <div class="hero">
      <div class="duo" id="hero-duo"></div>
      <h1>우리 집의 기운을<br>읽어 드려요</h1>
      <p>뒷산과 물길, 바람길로 집터를 쉬운 말로 읽어 드려요</p>
    </div>
    <form class="search" id="search">
      <input id="q" type="text" placeholder="예: 1100 Congress Ave, Austin, TX" autocomplete="off" aria-label="주소">
      <button class="btn" type="submit">보기</button>
    </form>
    <p class="hint" id="hint">캘리포니아·텍사스 집 주소를 넣거나, 아래 아홉 곳을 둘러보세요.</p>

    <div id="saved-tip"></div>

    <div class="section-label">둘러볼 아홉 곳 · 실제 지형 데이터로 읽었어요</div>
    <div class="sample" id="samples"></div>

    <div class="section-label">이용 방법 (가격은 시험 중이에요)</div>
    <div class="ladder">
      <div><b>무료</b><span>점수·등급<br>오늘의 박씨</span></div>
      <div><b>전체 해설</b><span>한눈에 보는 해설<br>우리 집 보완법</span><em>$1</em></div>
      <div><b>집 비교</b><span>2~3곳을<br>나란히</span><em>$1</em></div>
    </div>

    <p class="disclaimer"><button class="btn ghost small" id="open-about">길지는 어떻게 읽나요?</button></p>
  </section>

  <!-- S3 Reading -->
  <section id="reading" class="hidden">
    <div class="reading">
      <div id="reading-char" style="display:flex;justify-content:center"></div>
      <div class="serif" style="font-size:19px;font-weight:700" id="reading-addr"></div>
      <ol id="steps">
        <li>터주가 뒷산을 살피는 중</li>
        <li>물길을 따라가는 중</li>
        <li>바람길을 재는 중</li>
        <li>살펴볼 점을 찾는 중</li>
      </ol>
      <p class="hint" id="reading-wait" style="text-align:center"></p>
    </div>
  </section>

  <!-- S6 Report -->
  <section id="report" class="hidden"></section>

  <!-- S7 Compare -->
  <section id="compare" class="hidden"></section>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<script src="data.js"></script>
<script src="writer.js"></script>
<script src="tips.js"></script>
<script src="characters.js"></script>
<script src="config.js"></script>
<script src="live.js"></script>
<script>
const R = window.PUNGSU_REPORTS, W = window.PUNGSU_WRITER, TIPS = window.PUNGSU_TIPS, CH = window.PUNGSU_CHARS;
// US reference places (기준 터): historic estates and museums only, chosen 2026-11-09 to span
// very good → very bad (the very good one chosen by its land shape). No political sites, no celebrities, no one's current home.
const ORDER = ["us_filoli", "us_glenmont", "us_mount_vernon", "us_hearst", "us_fallingwater",
               "gyeongbokgung", "eunma", "mokdong7", "wolgok_highway"];   // US first: the beta is for US homes
const SHORT = { gyeongbokgung: "경복궁 근정전", eunma: "대치 은마아파트", mokdong7: "목동 7단지", wolgok_highway: "월곡 갑을명가",
                us_filoli: "필롤리 저택 (Filoli)", us_glenmont: "에디슨의 집 (Glenmont)", us_mount_vernon: "마운트 버넌",
                us_hearst: "허스트 캐슬", us_fallingwater: "낙수장 (Fallingwater)" };
// reference sites score the engine but are not homes: no interior tips, no "save as my home"
const LANDMARK = new Set(["gyeongbokgung", "us_filoli", "us_glenmont", "us_mount_vernon", "us_hearst",
                          "us_fallingwater"]);   // reference sites, not homes
// one-line story for each reference place, shown in its 기준 터 note (history only, no 풍수 claim)
const STORY = {
  gyeongbokgung: "조선의 으뜸 궁궐이에요.",
  us_filoli: "샌프란시스코에 물을 대던 회사의 주인 윌리엄 본이 1910년대에 지은 집이에요. 드라마 〈다이너스티〉의 저택으로도 나왔어요.",
  us_glenmont: "토머스 에디슨이 1886년부터 세상을 떠날 때까지 살던 집이에요.",
  us_mount_vernon: "조지 워싱턴이 살던 집이에요.",
  us_hearst: "신문왕 윌리엄 랜돌프 허스트가 바닷가 언덕에 지은 성이에요.",
  us_fallingwater: "건축가 프랭크 로이드 라이트가 폭포 바로 위에 지은 집이에요.",
};
const KEYWORDS = {
  gyeongbokgung: ["경복궁", "근정전", "사직로", "종로"],
  eunma: ["은마", "대치", "삼성로"],
  mokdong7: ["목동", "7단지", "양천"],
  wolgok_highway: ["월곡", "갑을", "성북"],
  us_filoli: ["필롤리", "Filoli", "filoli", "Woodside", "우드사이드"],
  us_glenmont: ["에디슨", "Edison", "edison", "Glenmont", "glenmont", "West Orange", "웨스트오렌지"],
  us_mount_vernon: ["마운트 버넌", "마운트버넌", "Mount Vernon", "mount vernon", "Vernon", "워싱턴"],
  us_hearst: ["허스트", "Hearst", "hearst", "San Simeon", "샌시미언"],
  us_fallingwater: ["낙수장", "Fallingwater", "fallingwater", "Mill Run", "Bear Run"],
};
const COMP = {
  hyeonmu: ["현무", "집 뒤의 땅"], jujak: ["주작", "집 앞"], enclosure: ["청룡·백호", "양옆"],
  jangpung: ["장풍", "겨울바람 막이"], deuksu: ["득수", "물"], jwahyang: ["좌향", "햇빛·방향"], stability: ["안정", "땅의 경사"],
};
const GIUN = { wealth: "재물운", health: "건강운", harmony: "가정화목", career: "학업·커리어", stability: "안정운" };
const OH = { wood: ["木", "목"], fire: ["火", "화"], earth: ["土", "토"], metal: ["金", "금"], water: ["水", "수"] };
const SECT = { hyeonmu: "현무", jujak: "주작", cheongryong: "청룡", baekho: "백호" };
// plain names for things to watch (same as api/card.py SAL_NAME["ko"]); 살 names only in "풍수로 보면"
const SAL_PLAIN = { nochung: "길이 집을 곧장 향해요", bangung: "물이 바깥으로 굽어요", gak: "모서리가 집을 향해요",
  cheoncham: "높은 건물 사이 좁은 틈", power: "송전선이 가까워요", dead_end: "막다른 길",
  overpass: "고가·다리가 가까워요", steep_back: "뒤가 가파른 비탈", cemetery: "묘지가 가까워요",
  eumseup: "땅이 낮고 습해요", halgak: "물이 집 바로 밑을 흘러요", jeongohuje: "앞이 높고 뒤가 낮아요" };
const salName = (x) => SAL_PLAIN[x.id] || x.name;
const BEND = { hwanpo: "집 쪽으로 감싸 흘러요", bangung: "집 바깥쪽으로 굽어 흘러요", straight: "곧게 흘러요" };
const DISCLAIMER = "본 분석은 전통 풍수 이론(형기론)에 따른 참고용 해석이며, 부동산 거래의 판단 근거가 아닙니다.";

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("pungsu." + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("pungsu." + k, JSON.stringify(v)); } catch (_) {} },
};
let unlocked = new Set(store.get("unlocked", []));
let dayOffset = 0;   // demo only: "내일 미리 보기" moves the tip date forward
let current = null;

function show(id) {
  ["home", "reading", "report", "compare"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
  if (id === "home") renderSavedTip();
  if (id === "report" && leafMap) setTimeout(() => leafMap.invalidateSize(), 50);
  window.scrollTo(0, 0);
}
function tipDate() { const d = new Date(); d.setDate(d.getDate() + dayOffset); return d; }
function fmtDate(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일 · ${TIPS.jeolgi(d)}`; }

/* ---------- home ---------- */
$("hero-duo").innerHTML = CH.toad(104, { cls: "bob" }) + CH.swallow(74, { cls: "flap" });
$("reading-char").innerHTML = CH.toad(120, { cls: "bob" });
$("samples").innerHTML = ORDER.map((id) => {
  const r = R[id];
  const tag = LANDMARK.has(id) ? ` <span class="chip" style="background:var(--accent-soft);color:var(--accent)">명소</span>`
    : id.startsWith("us_") ? ` <span class="chip">미국</span>` : "";
  return `<button data-id="${id}"><span><b class="serif" style="font-size:16px">${SHORT[id]}</b>${tag}<small>${r.site.address}</small></span><span class="arrow">→</span></button>`;
}).join("");
$("samples").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) read(b.dataset.id); });
$("search").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  const id = ORDER.find((k) => KEYWORDS[k].some((w) => q.includes(w)));
  if (id) { read(id); return; }
  if (window.GILJI && GILJI.api) { GILJI.lookup(q); return; }
  $("hint").textContent = "지금은 아래 아홉 곳만 볼 수 있어요.";
  $("hint").classList.add("err");
});
$("go-home").addEventListener("click", () => show("home"));
$("open-about").addEventListener("click", openAbout);

function tipCard(id, opts = {}) {
  if (LANDMARK.has(id)) {
    return `<div class="card tip">
      <div class="when"><span class="who">${CH.swallow(40)}흥이의 한마디</span></div>
      <h3>유명한 곳을 풍수로 읽어 봤어요</h3>
      <p>${STORY[id] ? STORY[id] + " " : ""}지금은 누구나 둘러볼 수 있는 곳이에요. 우리 집을 저장하면 흥이가 매일 그 집에 맞는 박씨를 물어 와요.</p>
    </div>`;
  }
  // the report's card always comes from this home's own reading; the home-screen card also
  // rotates in general interior and seasonal tips
  const r = R[id], d = tipDate(), t = TIPS.daily(r, d, { siteOnly: opts.saveBtn });
  return `<div class="card tip">
    <div class="when"><span class="who">${CH.swallow(40)}${opts.label || "흥이가 물어 온 오늘의 박씨"}</span><span>${fmtDate(d)}</span></div>
    <h3>${t.title}</h3>
    <p>${t.body}</p>
    <div class="row">
      <span class="chip">${t.tag}</span>
      ${opts.saveBtn ? (store.get("saved", null) === id
          ? `<span class="chip">내 집으로 저장됨</span>`
          : `<button class="btn ghost small" id="save-home">내 집으로 저장하고 매일 박씨 받기</button>`) : ""}
      <button class="btn ghost small" id="${opts.nextId || "tip-next"}">내일 미리 보기</button>
    </div>
  </div>`;
}
function renderSavedTip() {
  const id = store.get("saved", null);
  if (!id || !R[id] || LANDMARK.has(id)) { $("saved-tip").innerHTML = ""; return; }
  $("saved-tip").innerHTML = `<div class="section-label">내 집 · ${SHORT[id] || (window.GILJI_LABEL || {})[id] || ""}</div>` +
    tipCard(id, { nextId: "home-tip-next" });
  $("home-tip-next").addEventListener("click", () => { dayOffset++; renderSavedTip(); });
}

/* ---------- reading animation ---------- */
function read(id) {
  $("reading-addr").textContent = SHORT[id];
  $("reading-wait").textContent = "";
  show("reading");
  const lis = [...$("steps").children];
  lis.forEach((li) => (li.className = ""));
  const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dt = fast ? 120 : 520;
  lis.forEach((li, i) => {
    setTimeout(() => { li.className = "on"; if (i) lis[i - 1].className = "done"; }, i * dt);
  });
  setTimeout(() => { dayOffset = 0; renderReport(id); show("report"); }, lis.length * dt + 250);
}

/* ---------- report pieces ---------- */
function dial(total) {
  const r = 52, c = 2 * Math.PI * r, off = c * (1 - total / 100);
  return `<div class="dial"><svg viewBox="0 0 124 124" aria-hidden="true">
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}" style="transition:stroke-dashoffset 1s ease"/>
  </svg><div class="num"><b>${total}</b><span>/ 100</span></div></div>`;
}

/* 평지 (rules v0.6, "say less"): level land shows the grade, not a number, and names only the
   real differences: water and things to watch. Mirrors api/card.py's level card. */
function levelDial() {
  return `<div class="dial level"><svg viewBox="0 0 124 124" aria-hidden="true">
    <circle cx="62" cy="62" r="52" fill="none" stroke="var(--line)" stroke-width="9"/></svg>
    <div class="num"><b>평지</b><span>보통 · 점수 없음</span></div></div>`;
}
function levelLine(r) {
  const n = r.sal.length, water = r.score.components.deuksu.facts.distance_m != null;
  const second = water && n ? `가까운 물과 살펴볼 점 ${n}가지가 이 집을 다르게 해요.`
    : water ? "가까운 물이 이 집을 다르게 해요."
    : n ? `살펴볼 점 ${n}가지가 이 집을 다르게 해요.` : "가까이 살펴볼 점은 없어요.";
  return `땅이 평평해서, 땅이 알려 주는 것은 많지 않아요. ${second}`;
}
function levelChips(r) {
  const chips = r.sal.map((x) => `<span class="chip warn">${salName(x)}</span>`).slice(0, 3);
  const d = r.score.components.deuksu.facts;
  if (d.distance_m == null) chips.push(`<span class="chip">가까운 물이 없어요</span>`);
  else if (d.bend !== "bangung") chips.push(`<span class="chip">${d.bend === "hwanpo" ? "물이 감싸 흘러요" : d.bend === "straight" ? "물이 곧게 지나요" : "가까이 물이 있어요"}</span>`);
  chips.push(`<span class="chip">평평한 땅</span>`);
  if (!r.sal.length) chips.push(`<span class="chip">살펴볼 점 없음</span>`);
  return `<div class="level-chips">${chips.slice(0, 4).join("")}</div>`;
}

function factLine(key, f) {
  switch (key) {
    case "hyeonmu": return `뒤로 ${f.rise_m}m 솟음 · 뒤 하늘 ${f.back_horizon_deg}° 가림`;
    case "jujak": return (f.ansan ? `앞의 낮은 산 ${f.ansan_name || ""}` : "앞의 낮은 산 없음") + ` · 앞 하늘 ${f.front_horizon_deg}° 가림` + (f.front_overbearing ? " · 앞산이 뒷산보다 높음" : "");
    case "enclosure": return `왼쪽 ${f.cheongryong_deg}° · 오른쪽 ${f.baekho_deg}°` + (f.weak_side ? ` · ${SIDE[f.weak_side]} 약함` : " · 양쪽 모두 트임");
    case "jangpung": {  // rules v0.2: the cold wind is regional (Korea: 북서풍)
      const D8K = { N: "북", NE: "북동", E: "동", SE: "남동", S: "남", SW: "남서", W: "서", NW: "북서" };
      return `찬바람(${D8K[f.wind_from] || "북서"}) 쪽이 ${f.wind_open ? "열림" : "막힘"} · 사방 평균 ${f.mean_deg}°`;
    }
    case "deuksu": return `${f.bend_river} ${BEND[f.bend] || ""}` + (f.water_name && f.water_name !== f.bend_river ? ` · 가장 가까운 물 ${f.water_name} ${f.distance_m}m` : ` · ${f.distance_m}m`);
    case "jwahyang":  // rules v0.2: winter sun, not the door bearing
      return (f.sun_lost_h >= 0.5 ? `동짓날 해를 ${f.sun_lost_h}시간 가림` : "동짓날 해를 거의 안 가림")
        + (f.faces_sun ? " · 남쪽을 바라봄" : "") + (f.off_south_deg >= 22.5 ? ` · 현관은 정남에서 ${f.off_south_deg}° 비낌` : "");
    case "stability": return `대지 경사 ${f.slope_deg}°`;
  }
  return "";
}

const SIDE = { hyeonmu: "뒤", jujak: "앞", cheongryong: "왼쪽", baekho: "오른쪽" };
// 오방색: 현무 black, 주작 red, 청룡 blue-green, 백호 white
const SECT_COLOR = { hyeonmu: "#3a3f55", jujak: "#c0503a", cheongryong: "#2f7a6e", baekho: "#8f969e" };
const OH_COLOR = { wood: "#6f8f74", fire: "#c9705a", earth: "#c9a15a", metal: "#a3a7ad", water: "#5b6f8f" };

function verdict(r, k) {
  const c = r.score.components;
  if (k === "hyeonmu") return c.hyeonmu.score >= 80 ? "든든해요" : c.hyeonmu.score >= 55 ? "보통이에요" : "약해요";
  if (k === "jujak") {
    const f = c.jujak.facts;
    return f.front_overbearing ? "앞산이 뒤보다 높아요" : f.ansan ? "낮은 산이 마주 봐요" : "트였어요";
  }
  const deg = c.enclosure.facts[k === "cheongryong" ? "cheongryong_deg" : "baekho_deg"];
  return deg >= 3 ? "감싸요" : deg >= 1.5 ? "낮아요" : "트였어요";
}

// point at a bearing (deg, clockwise from north) and distance (m) from lat/lng
function dest(lat, lng, b, d) {
  const rad = (b * Math.PI) / 180;
  return [lat + (d * Math.cos(rad)) / 111320, lng + (d * Math.sin(rad)) / (111320 * Math.cos((lat * Math.PI) / 180))];
}

let leafMap = null;
function drawMap(id) {
  const el = $("sasinsa-map");
  if (!el || !window.L) return;
  if (leafMap) { leafMap.remove(); leafMap = null; }
  const r = R[id], lat = r.site.lat, lng = r.site.lng, facing = r.site.facing_deg;
  const m = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  m.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  leafMap = m;
  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom: 17,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM · 지도 스타일 © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)',
  }).addTo(m);

  // four wedges, turned with the house: 현무 behind, 주작 in front, 청룡 on the left looking out
  const center = { hyeonmu: facing + 180, jujak: facing, cheongryong: facing - 90, baekho: facing + 90 };
  const RAD = 3300;
  Object.entries(center).forEach(([k, c]) => {
    const pts = [[lat, lng]];
    for (let a = c - 45; a <= c + 45; a += 5) pts.push(dest(lat, lng, a, RAD));
    L.polygon(pts, { color: SECT_COLOR[k], weight: 1, opacity: .5, fillColor: SECT_COLOR[k], fillOpacity: .16, interactive: false }).addTo(m);
    L.marker(dest(lat, lng, c, RAD * 1.02), { interactive: false, icon: L.divIcon({ className: "sect-label",
      html: `<span style="border-color:${SECT_COLOR[k]}"><b>${SIDE[k]}</b><br><em>${verdict(r, k)}</em></span>`, iconSize: null }) }).addTo(m);
  });

  // river and overpass lines from the engine's own map data
  const lay = (window.PUNGSU_MAP || {})[id] || {};
  const d = r.score.components.deuksu.facts;
  (lay.river || []).forEach((line, i) => {
    const pl = L.polyline(line, { color: "#3b6ea8", weight: 5, opacity: .85 }).addTo(m);
    if (i === 0) pl.bindTooltip(`${d.bend_river} · ${(BEND[d.bend] || "").split(" (")[0]}`, { sticky: true });
  });
  const ov = r.sal.find((x) => x.id === "overpass");
  (lay.overpass || []).forEach((line, i) => {
    L.polyline(line, { color: "#c0392b", weight: 6, opacity: .9, dashArray: "8 6" }).addTo(m);
    if (i === 0 && ov) {
      // label the far end of the line so it doesn't sit on top of the house
      const far = lay.overpass.flat().reduce((a, q) => (m.distance(q, [lat, lng]) > m.distance(a, [lat, lng]) ? q : a));
      L.marker(far, { icon: L.divIcon({ className: "sal-mark", html: "!", iconSize: [20, 20], iconAnchor: [10, 10] }) })
        .bindTooltip(`${ov.evidence.road} 고가 · ${ov.evidence.distance_m}m`).addTo(m);
    }
  });

  // named hills the engine read
  r.peaks.filter((p) => p.name).forEach((p) => {
    L.marker(dest(lat, lng, p.bearing_deg, p.distance_m), { icon: L.divIcon({ className: "peak",
      html: `<i style="border-bottom-color:${OH_COLOR[p.shape]}"></i><span>${p.name}</span>`, iconSize: null }) })
      .bindTooltip(`${p.name} · ${Math.round(p.elev_m)}m · ${(p.distance_m / 1000).toFixed(1)}km`).addTo(m);
  });

  // the house: 터주 with an arrow for the way it faces
  const tip = dest(lat, lng, facing, 520);
  L.polyline([[lat, lng], tip], { color: "#b8684e", weight: 4, opacity: .95, interactive: false }).addTo(m);
  L.marker(tip, { interactive: false, icon: L.divIcon({ className: "face-arrow",
    html: `<span style="transform:rotate(${facing}deg)">▲</span>`, iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(m);
  L.marker([lat, lng], { icon: L.divIcon({ className: "home-pin", html: CH.toad(46), iconSize: [46, 40], iconAnchor: [23, 34] }) })
    .bindTooltip("이 집 · 화살표가 현관 방향").addTo(m);

  const E = RAD * 1.15;   // room for the side labels at the wedge edges
  const b = L.latLngBounds([dest(lat, lng, 0, E), dest(lat, lng, 180, E), dest(lat, lng, 90, E), dest(lat, lng, 270, E)]);
  m.fitBounds(b, { padding: [4, 4] });
  setTimeout(() => m.invalidateSize(), 80);
}

// The separate "US living" card (api/us_living.py): what US buyers value; never part of the 풍수 score.
function usLiving(r) {
  const u = r.us_living && r.us_living.ko;
  if (!u) return "";
  const KIND = { good: "좋아요", mixed: "의견이 갈려요", know: "알아 두세요" };
  const body = u.items.length
    ? u.items.map((x) => `<div class="it"><span class="k ${x.kind}">${KIND[x.kind]}</span><span>${x.text}</span></div>`).join("")
    : `<p style="margin:0;font-size:14px">${u.nothing}</p>`;
  return `<div class="card usl"><h2>${u.title} <small>풍수 점수와 별개</small></h2><p class="usl-note">${u.note}</p>${body}
    ${u.lot_note ? `<p class="usl-note" style="margin:8px 0 0">${u.lot_note}</p>` : ""}</div>`;
}

function stars(n) { return "★".repeat(n) + `<i>${"★".repeat(5 - n)}</i>`; }

function renderReport(id) {
  current = id;
  const live = window.GILJI && GILJI.isLive(id);
  const r = R[id], w = W[id] || (live ? GILJI.placeholder(id) : null), s = r.score, comps = s.components;
  const paid = unlocked.has(id) && !!W[id];
  const siteTips = TIPS.siteTips(r);
  const watchHtml = r.sal.length ? `<div class="watch">${r.sal.map((x) => `
      <div class="w"><h4>${salName(x)}</h4><p>${(w.sal[x.id] || {}).line || ""}</p>
      <div class="fix"><b>보완법</b> ${(w.sal[x.id] || {}).bibo || x.bibo.join(", ")}</div></div>`).join("")}</div>` : "";
  const tipsHtml = `<div class="tips">${siteTips.filter((t) => !r.sal.some((x) => x.id === t.id)).map((t) => `
      <div class="t"><h4><span class="chip">${t.tag}</span>${t.title}</h4><p>${t.body}</p></div>`).join("")}</div>`;
  const giunHtml = `<div class="giun">${r.giun.map((g) => `
      <div class="g"><b>${GIUN[g.key]}</b><span class="stars" aria-label="별 ${g.stars}개">${stars(g.stars)}</span>
      <p>${w.pungsu.giun[g.key]}</p></div>`).join("")}</div>`;
  const ohHtml = `<div class="oh">${Object.keys(OH).map((k) => `
      <div class="r"><span><b class="serif">${OH[k][0]}</b> ${OH[k][1]}</span>
      <div class="t"><div style="width:${Math.round(r.ohaeng[k] * 100)}%;background:var(--${k})"></div></div>
      <span class="pct">${Math.round(r.ohaeng[k] * 100)}%</span></div>`).join("")}</div>
      <p class="oh-note">${w.pungsu.ohaeng}</p>`;
  const deuksu = comps.deuksu.facts;

  const paidBlock = `
    <div class="card summary"><h2>한눈에</h2>
      <div class="section-label" style="margin:0 0 6px">좋은 점</div>${w.good.map((t) => `<p>${t}</p>`).join("")}
      ${w.watch.length ? `<div class="section-label" style="margin:10px 0 6px">아쉬운 점</div>${w.watch.map((t) => `<p>${t}</p>`).join("")}` : ""}
      ${r.confidence !== "high" ? `<p style="color:var(--ink-3);font-size:14px;font-family:inherit">현장 사진을 더하면 더 정확해져요.</p>` : ""}</div>
    <div class="card"><h2>${LANDMARK.has(id) ? "이 터를 집으로 쓴다면" : "우리 집 보완법"} <small>이 집터에 맞춘 방법</small></h2>
      ${r.sal.length ? `<div class="section-label" style="margin:0 0 8px">살펴볼 점</div>${watchHtml}<div class="section-label" style="margin:0 0 8px">집 안에서 할 수 있는 것</div>` : ""}
      ${tipsHtml}</div>
    <details class="card"><summary>풍수로 보면 <span>용어와 전통 · 펼치기</span></summary>
      <p style="font-family:'Gowun Batang',serif;font-size:15px;line-height:1.8;margin:0 0 14px">${w.pungsu.sides}</p>
      <div class="section-label" style="margin:0 0 8px">다섯 기운 <small>땅이 풍수에서 무엇을 돕는다고 보는지</small></div>${giunHtml}
      <div class="section-label" style="margin:16px 0 8px">오행 <small>주변 봉우리의 모양</small></div>${ohHtml}
    </details>`;

  $("report").innerHTML = `
    <div class="card">
      <div class="addr">${r.site.address || (window.GILJI_LABEL || {})[id] || ""}</div>
      <div class="top">
        ${s.level_land ? levelDial() : dial(s.total)}
        <div>
          ${s.level_land ? "" : `<span class="grade">${s.grade}</span>`}
          <div class="meta">현관이 ${["북", "북동", "동", "남동", "남", "남서", "서", "북서"][Math.round(((r.site.facing_deg % 360) + 360) % 360 / 45) % 8]}쪽을 봐요 (가정)<br>지도만으로 읽었어요</div>
        </div>
      </div>
      <div class="says">${CH.toad(64)}<div class="bubble">${s.level_land ? levelLine(r) : w.headline}</div></div>
      ${s.level_land ? levelChips(r) : ""}
    </div>

    ${tipCard(id, { saveBtn: true })}

    <div class="card map"><h2>집 주변 땅 <small>지도는 북쪽이 위</small></h2>
      <div id="sasinsa-map" class="leaf" role="img" aria-label="집 주변 지도: 사방의 산과 물길"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--accent)"></span>집과 현관 방향</span>
        <span><span class="dot" style="background:var(--water)"></span>물길</span>
        ${r.sal.some((x) => x.id === "overpass") ? `<span><span class="dot" style="background:#c0392b"></span>살펴볼 곳</span>` : ""}
        <span>▲ 주변 산</span></div>
      <div class="sasinsa">${Object.keys(SECT).map((k) => `<div><b>${SIDE[k]}</b><span>${verdict(r, k)}</span></div>`).join("")}</div>
      <div class="water-note">물길: <b>${deuksu.bend_river || `이름 없는 개울 (${deuksu.distance_m}m)`}</b>, ${BEND[deuksu.bend]}${r.sal.filter((x) => x.id === "overpass" && x.evidence).map((x) => `<br><span class="watch-note">살펴볼 곳: ${x.evidence.road} 고가, 현관 앞 ${x.evidence.distance_m}m (빨간 점선)</span>`).join("")}</div>
    </div>

    ${paid ? paidBlock : `
    <div class="locked">
      <div class="blur" aria-hidden="true">${paidBlock}</div>
      <div class="pay">
        <h3>이 집만을 위한 전체 해설</h3>
        <p>한눈에 · 보완법 ${siteTips.length}가지 · 풍수로 보면</p>
        <div class="price">$1 <small style="font-size:14px;color:var(--ink-3)">베타 동안 무료</small></div>
        <button class="btn accent" id="buy">전체 해설 열기</button>
        <p style="font-size:12px">구독 없이, 한 집에 한 번만</p>
      </div>
    </div>`}

    ${usLiving(r)}

    ${window.GILJI ? GILJI.chatCard(id) : ""}

    <details class="card"><summary>자세한 지형 판독 <span>일곱 가지 · 펼치기</span></summary>
      <div class="comp">${Object.keys(COMP).map((k) => {
        const v = comps[k].score;
        return `<div class="row"><span class="name"><b>${COMP[k][1]}</b><span>${COMP[k][0]}</span></span><span class="val">${v}</span>
          <div class="track"><div class="fill${v < 50 ? " low" : ""}" style="width:0" data-w="${v}%"></div></div>
          <div class="fact">${factLine(k, comps[k].facts)}</div></div>`;
      }).join("")}</div>
    </details>

    <div class="card photo-up"><div class="ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></div>
      <p><b>현장 사진 다섯 장</b>을 더하면 현관 방향과 길·고가 같은 살펴볼 점을 직접 확인해 더 정확하게 읽어 드려요. (다음 단계)</p></div>

    <div class="actions">
      <button class="btn ghost" id="to-compare">다른 집과 비교</button>
      <button class="btn ghost" id="to-home">다른 집 보기</button>
    </div>
    <p class="disclaimer">${DISCLAIMER}<br>데이터: Copernicus GLO-30, © OpenStreetMap contributors</p>`;

  // timers, not requestAnimationFrame: rAF stalls in background tabs and the bars would stay empty
  setTimeout(() => {
    document.querySelectorAll("#report .dial circle[data-off]").forEach((c) => (c.style.strokeDashoffset = c.dataset.off));
  }, 60);
  $("report").querySelector("details").addEventListener("toggle", (e) => {
    if (e.target.open) setTimeout(() => e.target.querySelectorAll(".fill").forEach((f) => (f.style.width = f.dataset.w)), 30);
  });
  if (!paid) $("buy").addEventListener("click", () => fakeDoor(id));
  if (window.GILJI) GILJI.bindChat(id);
  bindTip(id);
  setTimeout(() => drawMap(id), 0);   // after show("report") makes the container visible
  $("to-compare").addEventListener("click", () => openCompare(id));
  $("to-home").addEventListener("click", () => show("home"));
}

function bindTip(id) {
  const save = $("save-home");
  if (save) save.addEventListener("click", () => { store.set("saved", id); rerenderTip(id); });
  const next = $("tip-next");
  if (next) next.addEventListener("click", () => { dayOffset++; rerenderTip(id); });
}
function rerenderTip(id) {
  const old = $("report").querySelector(".tip");
  const holder = document.createElement("div");
  holder.innerHTML = tipCard(id, { saveBtn: true });
  old.replaceWith(holder.firstElementChild);
  bindTip(id);
}

/* ---------- fake-door paywall ---------- */
function fakeDoor(id) {
  const n = store.get("taps", 0) + 1;
  store.set("taps", n);
  const open = () => { unlocked.add(id); store.set("unlocked", [...unlocked]); renderReport(id); };
  if (window.GILJI && GILJI.isLive(id) && !W[id]) { GILJI.unlock(id, open); return; }
  sheet(`<h3>베타 동안은 무료예요</h3>
    <p>정식으로 열면 한 집에 $1 정도를 생각하고 있어요. 열어 보신 횟수를 이 브라우저에만 기록해요.</p>
    <p class="count">이 브라우저에서 연 횟수: ${n}</p>
    <button class="btn accent block" id="ok">전체 해설 열기</button>`);
  $("ok").addEventListener("click", () => { closeSheet(); open(); });
}

/* ---------- compare ---------- */
let picked = new Set();
function openCompare(fromId) {
  picked = new Set([fromId, ...ORDER.filter((k) => k !== fromId)].slice(0, 3));
  renderCompare(); show("compare");
}
function renderCompare() {
  const ids = ORDER.filter((k) => picked.has(k));
  const shown = ids.filter((k) => !R[k].score.level_land);   // level land has no number to compare
  const best = shown.length ? Math.max(...shown.map((k) => R[k].score.total)) : null;
  const row = (label, f) => `<tr><th>${label}</th>${ids.map((k) => `<td>${f(R[k], k)}</td>`).join("")}</tr>`;
  $("compare").innerHTML = `
    <div class="card"><h2>집 비교 <small>최대 세 곳</small></h2>
      <div class="pick">${ORDER.map((k) => `<button aria-pressed="${picked.has(k)}" data-id="${k}">${SHORT[k]}</button>`).join("")}</div>
      ${ids.length < 2 ? `<p class="none" style="margin-top:12px">두 곳 이상 골라 주세요.</p>` : `
      <div class="cmp"><table>
        <thead><tr><th></th>${ids.map((k) => `<th>${SHORT[k]}</th>`).join("")}</tr></thead>
        <tbody>
          ${row("점수", (r) => r.score.level_land ? `<span style="color:var(--ink-3);font-size:13px">평지라 점수 없음</span>` : `<span class="big ${r.score.total === best ? "best" : ""}">${r.score.total}</span>${r.score.total === best ? `<span class="tag">가장 높아요</span>` : ""}`)}
          ${row("등급", (r) => `<b class="serif">${r.score.grade}</b>`)}
          ${Object.keys(GIUN).map((g) => row(GIUN[g], (r) => `<span class="stars" style="letter-spacing:0">${stars(r.giun.find((x) => x.key === g).stars)}</span>`)).join("")}
          ${row("물길", (r) => `${r.score.components.deuksu.facts.bend_river}<br><span style="color:var(--ink-3);font-size:12px">${(BEND[r.score.components.deuksu.facts.bend] || "").split(" (")[0]}</span>`)}
          ${row("살펴볼 점", (r) => r.sal.length ? r.sal.map(salName).join("<br>") : "없음")}
          ${row("보완법", (r) => `${TIPS.siteTips(r).length}가지`)}
        </tbody></table></div>`}
    </div>
    <p class="disclaimer">점수는 참고용이에요. 어느 집이 좋을지는 직접 판단해 주세요.<br>${DISCLAIMER}</p>
    <div class="actions"><button class="btn ghost" id="cmp-home">처음으로</button><button class="btn ghost" id="cmp-back">보고서로</button></div>`;
  $("compare").querySelector(".pick").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.id;
    if (picked.has(k)) picked.delete(k); else if (picked.size < 3) picked.add(k);
    renderCompare();
  });
  $("cmp-home").addEventListener("click", () => show("home"));
  $("cmp-back").addEventListener("click", () => show("report"));
}

/* ---------- about + sheet ---------- */
function openAbout() {
  sheet(`<div class="about">
    <h3 style="margin-top:0">형기론 한 가지로 읽어요</h3>
    <p>산과 물, 땅의 모양으로 터를 읽는 형기론(形氣論)만 써요. 나경과 공식으로 보는 이기론은 다루지 않아요.</p>
    <h3>같은 집은 같은 점수</h3>
    <p>점수는 정해진 규칙이 매겨요. 해설은 그 결과를 풀어 쓸 뿐, 숫자를 바꾸거나 새 판단을 더하지 않아요.</p>
    <h3>무엇을 보나요</h3>
    <p>반경 3.5km의 지형으로 현무·주작·청룡·백호와 바람길을, 물길의 굽음으로 득수를, 주변 도로·고가·송전선·묘지로 살펴볼 점을 찾아요.</p>
    <h3>터주와 흥이</h3>
    <p>두꺼비 터주는 집터를 지키는 터줏대감이에요. 산과 물을 읽고 이 집의 이야기를 들려줘요. 제비 흥이는 흥부에게 박씨를 물어다 준 제비처럼, 매일 이 집에 맞는 박씨(오늘의 보완법) 하나를 물어 와요.</p>
    <h3>보완법</h3>
    <p>터의 모자란 곳을 나무, 가구, 색, 배치로 채우는 방법이에요. 풍수에서는 비보(裨補)라고 불러요.</p>
    <h3>데이터</h3>
    <p>Copernicus GLO-30 (© DLR e.V., © Airbus Defence and Space GmbH, provided under COPERNICUS by the EU and ESA) · © OpenStreetMap contributors (ODbL)</p>
    <p style="margin-top:14px;font-size:12px;color:var(--ink-3)">${DISCLAIMER}</p>
    <button class="btn block" id="ok" style="margin-top:12px">닫기</button></div>`);
  $("ok").addEventListener("click", closeSheet);
}
window.giljiShow = (id) => show(id);
window.giljiOpen = (id) => { dayOffset = 0; renderReport(id); show("report"); };
window.giljiSheet = (html) => sheet(html);
window.giljiCloseSheet = () => closeSheet();
function sheet(html) { $("sheet").innerHTML = html; $("modal").classList.remove("hidden"); }
function closeSheet() { $("modal").classList.add("hidden"); }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

renderSavedTip();
</script>
</body>
</html>
